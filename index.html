/* ===== Lichtung: Gestaltungssystem „Licht und Schatten im Wald“ =====
   Papier wie Birkenrinde (kühl, nicht creme), Tinte wie Tannenschatten.
   Gold ist nur Licht: es steht nur für Platz, der entstanden ist (Weite, Lichtung).
   Die Bereichsfarben kommen vom Waldboden: Heidekraut, Rinde, Bach, Flieder, Moos. */
:root{
  --g0:#F2F3EE; --g1:#EDEFE7; --g2:#E5E9DE;
  --s1:#F7F8F4; --s2:#E2E6DA; --s3:#D6DCCD;
  --ink:#17241D; --muted:#46534B; --faint:#58645C; --line:rgba(23,36,29,.16); --line2:rgba(23,36,29,.30);
  --lit:#E3B64E; --lit-ink:#775710; --lit-wash:rgba(227,182,78,.24);
  --on-ink:#F2F3EE; --btn:#17241D;
  --c-kl:#8C4669; --c-wo:#85582A; --c-pa:#2F6584; --c-er:#62539A; --c-ko:#47703A;
  --img-ink:#17241D; --img-paper:#EDEFE7; --img-sky:#5A7F96; --img-moon:#9DB4C4; --img-star:#5A7F96; --img-blossom:#FFFFFF; --img-snow:#FBFCFA;
  --ok:#47703A; --err:#9A3B32; --hatch:rgba(23,36,29,.22);
  --r-s:10px; --r-m:16px; --r-l:24px;
  --f-read:"Lora",Georgia,"Times New Roman",serif;
  --f-ui:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --g0:#0F1713; --g1:#121C17; --g2:#17221B;
  --s1:#18241E; --s2:#22302A; --s3:#2C3B34;
  --ink:#E2E7DD; --muted:#B0BAB2; --faint:#949F98; --line:rgba(226,231,221,.14); --line2:rgba(226,231,221,.28);
  --lit:#E7C15F; --lit-ink:#E7C15F; --lit-wash:rgba(231,193,95,.16);
  --on-ink:#121C17; --btn:#E2E7DD;
  --c-kl:#D896B6; --c-wo:#D5A472; --c-pa:#8DBBD8; --c-er:#B5A8E0; --c-ko:#9DC78A;
  --img-ink:#D2DACD; --img-paper:#121C17; --img-sky:#7FA3BA; --img-moon:#A9C1D1; --img-star:#D8E3EA; --img-blossom:#E8ECE4; --img-snow:#CBD3CA;
  --ok:#9DC78A; --err:#E59A8F; --hatch:rgba(226,231,221,.22); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --g0:#0F1713; --g1:#121C17; --g2:#17221B;
  --s1:#18241E; --s2:#22302A; --s3:#2C3B34;
  --ink:#E2E7DD; --muted:#B0BAB2; --faint:#949F98; --line:rgba(226,231,221,.14); --line2:rgba(226,231,221,.28);
  --lit:#E7C15F; --lit-ink:#E7C15F; --lit-wash:rgba(231,193,95,.16);
  --on-ink:#121C17; --btn:#E2E7DD;
  --c-kl:#D896B6; --c-wo:#D5A472; --c-pa:#8DBBD8; --c-er:#B5A8E0; --c-ko:#9DC78A;
  --img-ink:#D2DACD; --img-paper:#121C17; --img-sky:#7FA3BA; --img-moon:#A9C1D1; --img-star:#D8E3EA; --img-blossom:#E8ECE4; --img-snow:#CBD3CA;
  --ok:#9DC78A; --err:#E59A8F; --hatch:rgba(226,231,221,.22); color-scheme:dark;
}
*{box-sizing:border-box}
html{background:var(--g2);-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;color:var(--ink);font:400 17px/1.55 var(--f-read);background:transparent;min-height:100vh;
  -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;left:0;right:0;top:-50vh;bottom:-50vh;z-index:-1;
  background:linear-gradient(180deg,var(--g0) 0 25%,var(--g1) 51%,var(--g2) 75% 100%)}
button,input,textarea,select{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
a{color:inherit}
:focus-visible{outline:2px solid var(--ink);outline-offset:3px;border-radius:6px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
#app{max-width:560px;margin:0 auto;padding:calc(var(--safe-t) + 10px) 16px calc(96px + var(--safe-b));overflow-x:clip}

/* Kopf */
.top{display:flex;align-items:center;gap:10px;min-height:56px}
.logo{width:44px;height:44px;display:grid;place-items:center;border-radius:12px;flex:none}
.logo svg{width:34px;height:34px;fill:none;stroke:var(--ink);stroke-width:1.6;stroke-linecap:round}
.logo .lg-sun{fill:var(--lit);stroke:none}
.logo .lg-shaft{fill:var(--lit);stroke:none;opacity:.4}
.logo.spin svg .lg-trees{animation:part .9s ease}
@keyframes part{40%{transform:scaleX(1.12)}}
.logo svg .lg-trees{transform-origin:20px 20px}
.brand{display:flex;flex-direction:column;line-height:1.1;min-width:0;flex:1}
.wm{font:600 25px/1.05 var(--f-read);letter-spacing:.005em}
.sub{font:italic 400 14px/1.3 var(--f-read);color:var(--muted);margin-top:2px}
.ibtn{width:44px;height:44px;display:grid;place-items:center;border-radius:50%;flex:none}
.ibtn svg{width:22px;height:22px;fill:none;stroke:var(--ink);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.ibtn:active{background:var(--s2)}

/* Reiter */
.tabs{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:560px;z-index:20;
  display:grid;grid-template-columns:repeat(4,1fr);padding:6px 8px calc(6px + var(--safe-b));
  background:color-mix(in srgb,var(--g2) 92%,transparent);border-top:1px solid var(--line);
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0 10px;min-height:52px;border-radius:12px;color:var(--muted);font:500 12px/1.2 var(--f-ui)}
.tab svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.tab[aria-current="page"]{color:var(--ink);font-weight:600}
.tab:active{background:var(--s2)}
.tabdot{position:absolute;bottom:calc(8px + var(--safe-b));left:0;width:5px;height:5px;border-radius:50%;background:var(--ink);transition:transform .35s cubic-bezier(.3,.7,.2,1);pointer-events:none}

/* Typografie */
h1,h2,h3{font-family:var(--f-read);font-weight:600;margin:0;letter-spacing:-.005em}
h2{font-size:24px;line-height:1.2}
h3{font-size:19px;line-height:1.25}
p{margin:0 0 .7em}
.lead{font-size:18px}
.meta{font:400 13px/1.4 var(--f-ui);color:var(--faint)}
.muted{color:var(--muted)}
.small{font-size:15px;line-height:1.5}
.ui{font-family:var(--f-ui)}
.sec{margin:30px 0 0}
.sec>h2{margin-bottom:12px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:10px}
.sec-h h2{font-size:21px}
.hr{height:6px;margin:26px 0 22px;background:repeating-linear-gradient(-55deg,var(--line2) 0 1px,transparent 1px 5px);border:0}

/* Hauptbild */
.stage{position:relative;margin:4px -16px 0;container-type:inline-size}
.stage canvas{display:block;width:100%;touch-action:manipulation}
.stage .img-hit{position:absolute;inset:0;border-radius:0}
.tree-hit{position:absolute;width:44px;height:44px;transform:translate(-50%,-50%);border-radius:50%}
.tree-hit:focus-visible{outline-offset:0}
.stufe{display:flex;align-items:baseline;gap:10px;justify-content:space-between;margin:12px 0 0;padding:0 2px}
.stufe b{font:600 19px/1.2 var(--f-read)}
.stufe .weite{font:600 15px/1.2 var(--f-ui);color:var(--lit-ink);white-space:nowrap;display:inline-flex;align-items:center;gap:6px;min-height:44px}
.weite i{width:9px;height:9px;border-radius:50%;background:var(--lit);display:inline-block}
.bar{height:3px;background:var(--line);border-radius:2px;margin:2px 2px 0;overflow:hidden}
.bar i{display:block;height:100%;background:var(--lit);border-radius:2px}

/* Nächster Schritt */
.next{margin:22px 0 0;padding:18px 18px 18px;border:1px solid var(--line2);border-radius:var(--r-m);background:var(--s1);position:relative;overflow:hidden}
.next-h{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:8px}
.next h3{margin-bottom:6px}
.next p{color:var(--muted);font-size:16px}

/* Handlungen */
.acts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.tile{position:relative;overflow:hidden;min-height:96px;padding:14px 14px 12px;border-radius:var(--r-m);background:var(--s1);border:1px solid var(--line2);display:flex;flex-direction:column;gap:6px;justify-content:space-between}
.tile svg{width:30px;height:30px;fill:none;stroke:var(--ink);stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}
.tile b{display:block;font:600 16px/1.2 var(--f-ui)}
.tile span{display:block;margin-top:3px;font:400 13px/1.3 var(--f-ui);color:var(--muted)}
.tile::after{content:"";position:absolute;left:0;right:0;bottom:0;height:5px;background:repeating-linear-gradient(-55deg,var(--hatch) 0 1px,transparent 1px 4px);pointer-events:none}
.tile:active:not(.nopress){background:var(--s2)}
.links{display:flex;flex-wrap:wrap;gap:4px 18px;margin-top:10px}
.lnk{font:500 15px/1.3 var(--f-ui);color:var(--ink);text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:4px;min-height:44px;display:inline-flex;align-items:center}
.lnk:active{opacity:.6}

/* Karten und Zeilen */
.card{display:block;width:100%;position:relative;overflow:hidden;padding:16px 16px 14px;border-radius:var(--r-m);background:var(--s1);border:1px solid var(--line)}
.card+.card{margin-top:10px}
.card .meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:6px}
.card h3{font-size:18px}
.card p{margin:6px 0 0;color:var(--muted);font-size:15.5px}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none;background:var(--faint)}
.dot.kl{background:var(--c-kl)}.dot.wo{background:var(--c-wo)}.dot.pa{background:var(--c-pa)}.dot.er{background:var(--c-er)}.dot.ko{background:var(--c-ko)}
.list{border-top:1px solid var(--line)}
.row{display:flex;align-items:center;gap:12px;width:100%;min-height:56px;padding:10px 2px;border-bottom:1px solid var(--line);position:relative}
.row:active,.row.pressed{background:var(--s2)}
.row .t{flex:1;min-width:0}
.row .t b{display:block;font:600 16.5px/1.3 var(--f-read)}
.row .t span{display:block;font:400 13px/1.35 var(--f-ui);color:var(--faint);margin-top:2px}
.row .chev{width:16px;height:16px;flex:none;fill:none;stroke:var(--faint);stroke-width:1.6}
.row.read .t b{font-weight:500;color:var(--muted)}
.ev{display:inline-flex;gap:2px;align-items:center}
.ev i{width:6px;height:6px;border-radius:50%;border:1px solid var(--faint)}
.ev i.on{background:var(--faint)}
.tag{font:500 12px/1 var(--f-ui);padding:4px 7px;border-radius:6px;background:var(--s2);color:var(--muted)}
.tag.myth{background:transparent;border:1px solid var(--line2)}

/* Knöpfe */
.btn{position:relative;overflow:hidden;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 22px;border-radius:999px;
  font:600 16px/1.2 var(--f-ui);background:var(--btn);color:var(--on-ink)}
.btn.sec2{background:transparent;color:var(--ink);border:1px solid var(--line2)}
.btn.quiet{background:var(--s2);color:var(--ink)}
.btn.wide{width:100%}
.btn:disabled{opacity:.4;cursor:default}
.btn:active:not(:disabled):not(.nopress){filter:brightness(.92)}
.btns{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}
.rip{position:absolute;border-radius:50%;background:currentColor;opacity:.16;pointer-events:none;transform:scale(.2);animation:rip .6s ease-out forwards;z-index:1}
@keyframes rip{to{transform:scale(1);opacity:0}}

/* Auswahl */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{position:relative;overflow:hidden;min-height:44px;padding:0 15px;border-radius:999px;border:1px solid var(--line2);font:500 15px/1.2 var(--f-ui);display:inline-flex;align-items:center;gap:8px;background:transparent}
.chip.on,.opt.on,.scale>button.on,.ans.on{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink);color:var(--ink);font-weight:600}
.chip.on::before,.opt.on::before,.scale>button.on::before,.ans.on::before{content:"";position:absolute;inset:0;border-radius:inherit;background:repeating-linear-gradient(-55deg,var(--hatch) 0 1px,transparent 1px 5px);pointer-events:none}

.chipx{min-height:36px;padding:0 12px;border-radius:999px;font:500 14px/1.2 var(--f-ui);border:1px solid var(--line);display:inline-flex;align-items:center;gap:6px;position:relative}
.chipx.on{border-color:var(--ink);background:var(--s2)}
.chipx::after{content:"";position:absolute;inset:-5px 0}
.opts{display:flex;flex-direction:column;gap:8px}
.opt,.ans{position:relative;overflow:hidden;width:100%;min-height:52px;padding:12px 16px;border-radius:14px;border:1px solid var(--line2);font:500 16px/1.35 var(--f-ui);display:flex;align-items:center;gap:10px;background:transparent;text-align:left}
.opt small{display:block;font-weight:400;font-size:13.5px;color:var(--muted);margin-top:2px}

.ans.ok{border-color:var(--ok);box-shadow:inset 0 0 0 1px var(--ok)}
.ans.no{border-color:var(--err)}
.ans:disabled{cursor:default}
@property --fr{syntax:"<percentage>";inherits:false;initial-value:150%}
.fill-in::before{-webkit-mask:radial-gradient(circle at var(--fx,50%) var(--fy,50%),#000 var(--fr),transparent calc(var(--fr) + 1%));mask:radial-gradient(circle at var(--fx,50%) var(--fy,50%),#000 var(--fr),transparent calc(var(--fr) + 1%));animation:fillin .45s ease-out}
@keyframes fillin{from{--fr:0%}to{--fr:150%}}
.scale{display:flex;gap:6px}
.scale>button{position:relative;overflow:hidden;flex:1;min-height:48px;border-radius:999px;border:1px solid var(--line2);font:600 16px/1 var(--f-ui);display:grid;place-items:center;text-align:center}
.scale-l{display:flex;justify-content:space-between;font:400 12.5px/1.3 var(--f-ui);color:var(--faint);margin-top:6px}
.shake{animation:shake .32s ease}
@keyframes shake{25%{transform:translateX(-4px)}50%{transform:translateX(4px)}75%{transform:translateX(-2px)}}
.nopress{filter:none !important}

/* Schalter */
.set{display:flex;align-items:center;justify-content:space-between;gap:14px;min-height:56px;border-bottom:1px solid var(--line);padding:6px 0}
.set b{font:500 16px/1.3 var(--f-ui)}
.set span{display:block;font:400 13px/1.35 var(--f-ui);color:var(--faint)}
.switch{position:relative;width:52px;height:32px;border-radius:999px;background:var(--s3);flex:none;transition:background .2s}
.switch::before{content:"";position:absolute;left:3px;top:3px;width:26px;height:26px;border-radius:999px;background:var(--s1);box-shadow:0 1px 2px rgba(0,0,0,.25);transition:transform .22s,width .15s}
.switch[aria-checked="true"]{background:var(--btn)}
.switch[aria-checked="true"]::before{transform:translateX(20px)}
.switch:active::before{width:32px}
.switch[aria-checked="true"]:active::before{transform:translateX(14px)}
.switch::after{content:"";position:absolute;inset:-6px}

/* Felder */
.fld{display:block;margin:16px 0 0}
.fld>span{display:block;font:500 14px/1.3 var(--f-ui);color:var(--muted);margin-bottom:8px}
.inp{width:100%;min-height:48px;padding:12px 14px;border-radius:12px;border:1px solid var(--line2);background:var(--s1);font:400 17px/1.4 var(--f-ui)}
textarea.inp{min-height:84px;resize:vertical}
.inp:focus{outline:2px solid var(--ink);outline-offset:1px}
.note{font:400 14px/1.45 var(--f-ui);color:var(--muted);margin-top:8px}
.box{padding:14px 16px;border-radius:14px;background:var(--s2);margin-top:14px}
.box.lit{background:transparent;border:1px solid var(--line2);background-image:repeating-linear-gradient(-55deg,var(--hatch) 0 1px,transparent 1px 7px);background-size:100% 6px;background-repeat:no-repeat;background-position:0 0;padding-top:18px}
.box b{font-family:var(--f-ui);font-weight:600;font-size:15px}

/* Blätter */
.layer{position:fixed;inset:0;z-index:40}
.layer[hidden]{display:none}
.scrim{position:absolute;inset:0;background:rgba(10,16,13,.42);animation:fade .25s}
.sheet{position:absolute;left:50%;bottom:0;width:100%;max-width:560px;max-height:calc(100% - 28px - var(--safe-t));transform:translateX(-50%);
  background:var(--g1);border-radius:var(--r-l) var(--r-l) 0 0;display:flex;flex-direction:column;animation:up .32s cubic-bezier(.2,.8,.2,1);box-shadow:0 -1px 0 var(--line)}
.sheet.drag{transition:none}
.grip{height:26px;display:grid;place-items:center;flex:none;cursor:grab;touch-action:none}
.grip i{width:40px;height:5px;border-radius:3px;background:var(--line2)}
.sheet-in{overflow-y:auto;overscroll-behavior:contain;padding:4px 20px calc(28px + var(--safe-b));-webkit-overflow-scrolling:touch}
.sh-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:6px}
.sh-close{min-height:44px;padding:0 16px;border-radius:999px;background:var(--s2);font:500 15px/1 var(--f-ui)}
.sh-close:active{filter:brightness(.92)}
.sheet h2{margin:2px 0 10px}
.prog{display:flex;gap:4px;margin:2px 0 14px}
.prog i{flex:1;height:3px;border-radius:2px;background:var(--line)}
.prog i.on{background:var(--ink)}
@keyframes up{from{transform:translate(-50%,100%)}}
@keyframes fade{from{opacity:0}}
.sheet.out{transform:translate(-50%,100%);transition:transform .25s ease-in}

/* Meldung */
.toast{position:fixed;left:50%;bottom:calc(84px + var(--safe-b));transform:translate(-50%,20px);z-index:60;width:calc(100% - 32px);max-width:528px;
  background:var(--btn);color:var(--on-ink);border-radius:14px;padding:6px 6px 6px 16px;display:flex;align-items:center;gap:10px;min-height:52px;
  font:500 15px/1.35 var(--f-ui);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s}
.toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast.up{bottom:auto;top:calc(10px + var(--safe-t))}
.toast .tx{flex:1}
.toast button{min-height:44px;padding:0 14px;border-radius:10px;font:600 15px/1 var(--f-ui);text-decoration:underline;text-underline-offset:3px}
.toast svg{width:20px;height:20px;flex:none;fill:none;stroke:var(--on-ink);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.toast svg path{stroke-dasharray:24;stroke-dashoffset:24;animation:draw .45s .1s ease-out forwards}
@keyframes draw{to{stroke-dashoffset:0}}

/* Bilanz */
.nums{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.num{position:relative;overflow:hidden;padding:14px 14px 12px;border-radius:var(--r-m);background:var(--s1);border:1px solid var(--line);text-align:left;min-height:96px}
.num b{display:block;font:600 28px/1.1 var(--f-read);font-variant-numeric:lining-nums tabular-nums}
.num b.gold{color:var(--lit-ink)}
.num span{display:block;font:400 13.5px/1.35 var(--f-ui);color:var(--muted);margin-top:6px}
.wege{display:grid;gap:2px}
.weg{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:12px;min-height:52px;border-bottom:1px solid var(--line);padding:6px 0;width:100%}
.weg .st{display:flex;gap:5px}
.weg .st i{width:22px;height:8px;border-radius:4px;border:1px solid var(--line2)}
.weg .st i.on{background:var(--ink);border-color:var(--ink)}
.weg b{font:600 16px/1.3 var(--f-ui);display:flex;align-items:center;gap:8px}
.stufen li{display:flex;gap:12px;padding:8px 0;border-bottom:1px solid var(--line)}
.stufen{list-style:none;margin:0;padding:0}
.stufen li .w{font:500 13px/1.6 var(--f-ui);color:var(--faint);width:44px;flex:none;font-variant-numeric:tabular-nums}
.stufen li b{display:block;font:600 16px/1.3 var(--f-read)}
.stufen li span{display:block;font-size:15px;color:var(--muted)}
.stufen li.off b,.stufen li.off span{color:var(--faint);font-weight:400}
.stufen li.cur b::after{content:" (jetzt)";font:400 13px var(--f-ui);color:var(--lit-ink)}
.legend{display:grid;gap:10px;margin-top:6px}
.legend div{display:flex;gap:12px;align-items:flex-start}
.legend svg{width:34px;height:34px;flex:none;fill:none;stroke:var(--ink);stroke-width:1.2;stroke-linecap:round}
.legend p{margin:0;font-size:15.5px}
.empty{padding:18px 0;color:var(--muted);font-style:italic}
.src{font:400 13.5px/1.5 var(--f-ui);color:var(--muted);word-break:break-word}
.src a{color:var(--ink)}
blockquote{margin:12px 0;padding:0 0 0 14px;border-left:2px solid var(--line2);font-style:italic}
details{border-bottom:1px solid var(--line)}
summary{list-style:none;min-height:52px;display:flex;align-items:center;justify-content:space-between;gap:10px;cursor:pointer;font:600 16px/1.3 var(--f-ui)}
summary::-webkit-details-marker{display:none}
summary::after{content:"";width:9px;height:9px;border-right:1.6px solid var(--faint);border-bottom:1.6px solid var(--faint);transform:rotate(45deg) translateY(-3px);transition:transform .2s}
details[open] summary::after{transform:rotate(225deg)}
summary:active{opacity:.7}
.dn{padding:0 0 12px}
.qcount{font:600 14px/1 var(--f-ui);color:var(--faint)}
ol.steps{padding-left:22px;margin:8px 0}
ol.steps li{margin:4px 0}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.cmp div{padding:12px;border-radius:12px;background:var(--s2)}
.cmp b{display:block;font:600 22px/1.1 var(--f-read)}
.cmp span{font:400 13px/1.3 var(--f-ui);color:var(--muted)}
.mom-art{display:block;width:100%;max-width:220px;margin:4px auto 12px}

/* Bewegung reduziert */
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation:none !important;transition:none !important}
}
label.hap{position:absolute;inset:0;z-index:6;touch-action:manipulation;border-radius:inherit;-webkit-tap-highlight-color:transparent}
label.hap>input{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none;margin:0}
:disabled>label.hap{display:none}

#sh-t:focus{outline:none}

ul.steps{padding-left:20px;margin:8px 0}
ul.steps li{margin:6px 0}
.stat{width:26px;height:26px;border-radius:50%;border:1px solid var(--line2);display:grid;place-items:center;flex:none;font:600 13px/1 var(--f-ui);color:var(--faint);margin-top:2px}
.stat.on{background:var(--ink);border-color:var(--ink);color:var(--on-ink)}
.lnk.inl{display:inline;min-height:0;position:relative}
.lnk.inl::after{content:"";position:absolute;inset:-12px -4px}
.chipx{min-height:40px}
.filebtn{cursor:pointer}
.sub-tab .sub{display:none}
.sub-tab .top{min-height:50px}
.num b small{font:400 15px/1 var(--f-ui);color:var(--muted)}
.chip,.opt,.ans,.scale>button{isolation:isolate}
.chip.on::before,.opt.on::before,.scale>button.on::before,.ans.on::before{z-index:-1}

<script>

const APPNAME="Lichtung";

const AREAS=[

];

const SIZES=[
  {v:1,n:"Ein Ding",x:"ein Buch, ein Pullover, eine Tasse"},
  {v:3,n:"Eine Tüte oder Kiste",x:"mehrere Dinge auf einmal"},
  {v:5,n:"Etwas Großes",x:"ein Möbelstück, ein Gerät, ein Fahrrad"}
];
const WEGE=[
  {id:"ver",n:"Verschenkt",g:1},
  {id:"spe",n:"Gespendet",g:1},
  {id:"vk", n:"Verkauft",g:1},
  {id:"rec",n:"Recycelt",g:0},
  {id:"mue",n:"Entsorgt",g:0}
];

/* Gründe, ein Ding bewusst zu behalten */
const GRUENDE=[
  {id:"oft",n:"Ich nutze es oft",x:"Ein Ding, das viel gebraucht wird, verdient seinen Platz. Was lange hält und oft benutzt wird, muss nicht neu gekauft werden."},

const IMPULSE_A=[
{ id:"i01", cat:"ko",
  t:"Erlebnisse machen oft länger froh als Dinge",
  x:"Van Boven und Gilovich befragten 2003 rund 1.260 Menschen in den USA. Sie sollten an einen Kauf für ein Erlebnis denken, etwa eine Reise oder ein Konzert, und an einen Kauf für ein Ding, etwa Kleidung. 57 Prozent sagten, das Erlebnis habe sie glücklicher gemacht. 34 Prozent nannten das Ding. In einem Experiment mit Studierenden hob schon das Erinnern an ein Erlebnis die Stimmung etwas stärker als das Erinnern an ein Ding.",
  c:"Eine Metaanalyse von 2021, also eine gemeinsame Auswertung von 141 Studien, findet einen kleinen bis mittleren Vorteil. Etwa ein Drittel davon geht vermutlich auf unveröffentlichte Studien ohne Ergebnis zurück. Bei schlechten oder allein gemachten Erlebnissen verschwindet er. Fürs Klima sind Erlebnisse nicht automatisch besser: Ein Flug auf die Kanaren und zurück verursacht laut Umweltbundesamt rund 1,2 Tonnen CO2 pro Person.",
  src:"Van Boven, L., & Gilovich, T. (2003). To do or to have? That is the question. Journal of Personality and Social Psychology, 85(6), 1193–1202. Weingarten, E., & Goodman, J. K. (2021). Re-examining the experiential advantage in consumption: A meta-analysis and review. Journal of Consumer Research, 47(6), 855–877. Umweltbundesamt: Wie klimaschädlich sind Flugreisen und Kreuzfahrten? (UBA fragen, online).",
  u:"https://doi.org/10.1037/0022-3514.85.6.1193",
  links:[{n:"Weingarten & Goodman 2021",u:"https://doi.org/10.1093/jcr/ucaa047"},{n:"Umweltbundesamt: Flugreisen",u:"https://www.umweltbundesamt.de/service/uba-fragen/wie-klimaschaedlich-sind-flugreisen-kreuzfahrten"}],
  ev:2, typ:"Beobachtung",
  tip:"Das kann heißen: Bevor du etwas kaufst, lohnt die Frage, ob es auch ein gemeinsames Erlebnis gäbe, das dir dasselbe gibt. Ein Gesetz ist das nicht, nur eine Tendenz.",
  s:"Das kann heißen: Ein Nachmittag mit Freunden bleibt dir vielleicht länger als ein neues Teil. Das gilt aber nicht immer, und beides ist erlaubt.",
  myth:false },

{ id:"i02", cat:"ko",
  t:"Die Vorfreude auf ein Erlebnis fühlt sich besser an",
  x:"Kumar, Killingsworth und Gilovich untersuchten 2014 das Warten vor einem Kauf. In einer Studie wurden 2.266 Erwachsene per Handy zu zufälligen Zeiten gefragt, woran sie gerade denken. Bei 19,1 Prozent der Antworten dachten sie an einen geplanten Kauf. Wer auf ein Erlebnis wartete, fühlte sich dabei glücklicher als jemand, der auf ein Ding wartete. Warten auf Dinge wurde häufiger als ungeduldig beschrieben, Warten auf Erlebnisse eher als aufregend.",
  c:"Die vier Studien stammen aus einer Arbeitsgruppe. Eine unabhängige Wiederholung ist uns nicht bekannt. Die Unterschiede sind deutlich, aber die Messung beruht auf Selbstauskunft. Ob du selbst so empfindest, kannst du nur an dir prüfen.",
  src:"Kumar, A., Killingsworth, M. A., & Gilovich, T. (2014). Waiting for merlot: Anticipatory consumption of experiential and material purchases. Psychological Science, 25(10), 1924–1931.",
  u:"https://doi.org/10.1177/0956797614546556",
  ev:2, typ:"Beobachtung",
  tip:"Vielleicht ist Vorfreude selbst schon ein Teil des Werts. Ein Erlebnis früh zu planen und dann zu warten, kann die Zeit davor angenehm machen.",
  myth:false },

{ id:"i03", cat:"ko",
  t:"Wenn das Geld knapp ist, sieht es anders aus",
  x:"Lee, Hall und Wood prüften 2018 in mehreren Studien, für wen der Erlebnisvorteil gilt. Menschen mit höherem Einkommen und mehr Bildung waren über Erlebnisse glücklicher als über Dinge. Menschen mit weniger Geld waren über beide gleich froh oder sogar mehr über Dinge. Wer sich nur vorstellte, 50 Prozent weniger Geld im Monat zu haben, zeigte schon einen kleineren Erlebnisvorteil. Ein Ding, das lange hält, kann bei knappem Geld vernünftiger sein.",
  c:"Die Studien wurden vorab angemeldet, und die Daten sind offen. Die Metaanalyse von Weingarten und Goodman (2021) passt dazu: An privaten, teuren Hochschulen war der Vorteil größer als an staatlichen. Eine Korrekturnotiz von 2019 betrifft nur eine Kontrollfrage in Studie 3, nicht die Ergebnisse.",
  src:"Lee, J. C., Hall, D. L., & Wood, W. (2018). Experiential or material purchases? Social class determines purchase happiness. Psychological Science, 29(7), 1031–1039. Korrekturnotiz: Corrigendum (2019). Psychological Science, 30(1), 153. Weingarten, E., & Goodman, J. K. (2021). Journal of Consumer Research, 47(6), 855–877.",
  u:"https://doi.org/10.1177/0956797617736386",
  links:[{n:"Korrekturnotiz 2019",u:"https://doi.org/10.1177/0956797618815623"},{n:"Weingarten & Goodman 2021",u:"https://doi.org/10.1093/jcr/ucaa047"}],
  ev:2, typ:"Beobachtung",
  tip:"Das kann heißen: Ratschläge wie „Kauf Erlebnisse statt Dinge“ passen nicht für alle. Ein gutes, haltbares Ding ist bei wenig Geld keine schlechte Wahl.",
  myth:false },

{ id:"i04", cat:"ko",
  t:"Die Freude an Neuem verblasst",
  x:"Fachleute nennen das hedonische Anpassung: Man gewöhnt sich an Gutes, und die Freude wird kleiner. Eine bekannte, kleine Studie von Brickman und Kollegen aus dem Jahr 1978 befragte 22 Menschen, die mindestens 50.000 Dollar im Lotto gewonnen hatten. Auf einer sechsstufigen Skala gaben sie ihr Glück mit 4,00 an. Eine Vergleichsgruppe ohne Gewinn kam auf 3,82. Der Unterschied war statistisch nicht bedeutsam. Das spricht dafür, dass sich die Gewinner an ihr Glück gewöhnt hatten.",
  c:"Die Studie ist klein, fast die Hälfte der Angefragten antwortete nicht. Eine große schwedische Studie (Lindqvist, Östling und Cesarini, 2020) mit 3.362 Gewinnern fand Jahre später eine etwas höhere Lebenszufriedenheit, aber kein messbar besseres Glücksgefühl im Alltag. Anpassung ist also stark, aber nicht vollständig.",
  src:"Brickman, P., Coates, D., & Janoff-Bulman, R. (1978). Lottery winners and accident victims: Is happiness relative? Journal of Personality and Social Psychology, 36(8), 917–927.",
  u:"https://doi.org/10.1037/0022-3514.36.8.917",
  ev:1, typ:"Beobachtung",
  tip:"Die Studie betraf Lottogewinne, nicht Einkäufe. Übertragen kann das heißen: Auch das Hochgefühl nach einem Kauf hält vielleicht nicht lange. Das zu wissen, kann beim Abwägen helfen.",
  myth:false },

{ id:"i05", cat:"wo",
  t:"Was mir gehört, scheint mehr wert",
  x:"Kahneman, Knetsch und Thaler gaben 1990 Studierenden Kaffeebecher aus dem Uni-Laden. Ein Teil bekam einen Becher geschenkt, ein anderer Teil nicht. In einem Versuch wollten Besitzer im Mittel 7,12 Dollar für ihren Becher haben. Wer keinen hatte, wollte nur 2,87 Dollar zahlen. Statt der erwarteten 12 bis 13 Tauschgeschäfte kamen nur 3 zustande. Das nennt man Besitztumseffekt: Dinge werden mehr wert, sobald sie uns gehören.",
  c:"Plott und Zeiler (2005) fanden keinen Unterschied, wenn die Teilnehmenden das Verfahren vorher gründlich übten. Sie hielten den Effekt für ein Missverständnis im Versuch. Fehr, Hakimov und Kübler (2015) wiederholten diesen Versuch und fanden den Unterschied bei Bechern doch. Die Debatte über Ursache und Größe läuft weiter.",
  src:"Kahneman, D., Knetsch, J. L., & Thaler, R. H. (1990). Experimental tests of the endowment effect and the Coase theorem. Journal of Political Economy, 98(6), 1325–1348. Plott, C. R., & Zeiler, K. (2005). American Economic Review, 95(3), 530–545. Fehr, D., Hakimov, R., & Kübler, D. (2015). The willingness to pay–willingness to accept gap: A failed replication of Plott and Zeiler. European Economic Review, 78, 120–128.",
  u:"https://doi.org/10.1086/261737",
  links:[{n:"Plott & Zeiler 2005",u:"https://doi.org/10.1257/0002828054201387"},{n:"Fehr, Hakimov & Kübler 2015",u:"https://doi.org/10.1016/j.euroecorev.2015.05.006"}],
  ev:2, typ:"Experiment",
  tip:"Vielleicht hilft beim Aussortieren die Frage: Würde ich das heute für den Preis kaufen, den ich dafür haben will? Wenn nicht, spricht der Besitz, nicht der Nutzen.",
  myth:false },

{ id:"i06", cat:"wo",
  t:"„Es war doch teuer“: versunkene Kosten",
  x:"Versunkene Kosten sind Ausgaben, die schon weg sind und nicht zurückkommen. Arkes und Blumer verkauften 1985 Theater-Abos an 54 Menschen. Einige zahlten den vollen Preis von 15 Dollar, andere bekamen 2 oder 7 Dollar Rabatt. Wer voll bezahlt hatte, nutzte in der ersten Saisonhälfte im Mittel 4,11 Karten. In den Rabattgruppen waren es nur 3,32 und 3,29. In einer Fragebogenaufgabe wählten 54 Prozent die teurere Reise, obwohl die billigere mehr Spaß versprach.",
  c:"Im großen Projekt „Many Labs“ (Klein und andere, 2014) ließ sich eine ähnliche Gedankenaufgabe in 36 Stichproben mit zusammen 6.344 Menschen wiederholen. Der Theaterversuch mit echtem Verhalten war dagegen klein, und der Unterschied schrumpfte in der zweiten Saisonhälfte.",
  src:"Arkes, H. R., & Blumer, C. (1985). The psychology of sunk cost. Organizational Behavior and Human Decision Processes, 35(1), 124–140.",
  u:"https://doi.org/10.1016/0749-5978(85)90049-4",
  ev:2, typ:"Experiment",
  tip:"Das kann heißen: Der Preis von damals ist kein guter Grund, etwas heute zu behalten. Die bessere Frage ist, ob es dir ab jetzt etwas nützt.",
  s:"Das kann heißen: Auch wenn etwas teuer war, musst du es nicht behalten. Frag bei Geschenken oder Dingen, die deine Eltern bezahlt haben, aber kurz nach.",
  myth:false },

{ id:"i07", cat:"er",
  t:"Ein Foto kann das Weggeben leichter machen",
  x:"Winterich, Reczek und Irwin starteten 2017 eine Spendenaktion in sechs Wohnheimen mit 797 Studierenden. In einem Teil der Häuser bat ein Aushang darum, Erinnerungsstücke vor dem Spenden zu fotografieren. In den anderen Häusern hieß es nur, man solle spenden. Mit Foto-Hinweis kamen 613 Dinge zusammen, ohne 533. In fünf weiteren Experimenten sagten Menschen mit Foto, sie hätten weniger das Gefühl, mit dem Ding ein Stück von sich selbst zu verlieren.",
  c:"Die Feldstudie verglich ganze Häuser, nicht einzelne Personen. Der Unterschied ist daher nur ein Hinweis. Beim Verkaufen von Dingen trat der Effekt laut den Autoren nicht auf. Eine unabhängige Wiederholung ist uns nicht bekannt.",
  src:"Winterich, K. P., Reczek, R. W., & Irwin, J. R. (2017). Keeping the memory but not the possession: Memory preservation mitigates identity loss from product disposition. Journal of Marketing, 81(5), 104–120.",
  u:"https://doi.org/10.1509/jm.16.0311",
  ev:1, typ:"Experiment",
  tip:"Vielleicht gehört die Erinnerung nicht unbedingt am Ding fest. Ein Foto und ein Satz dazu, warum es dir wichtig war, können sie bewahren.",
  myth:false },

{ id:"i08", cat:"wo",
  t:"Unordnung zu Hause und das Stresshormon",
  x:"Im Jahr 2010 ließen Saxbe und Repetti 60 berufstätige Eheleute ihr Zuhause per Video vorführen. Ein Programm zählte, wie oft sie Wörter für Unordnung und Unfertiges benutzten. An drei Werktagen gaben alle mehrmals Speichelproben für das Stresshormon Cortisol ab. Normalerweise sinkt Cortisol im Laufe des Tages deutlich. Bei Frauen, die ihr Zuhause oft als unordentlich und unfertig beschrieben, sank es flacher. Dieses Muster gilt als ungünstig für die Gesundheit.",
  c:"Die Studie ist klein und zeigt nur einen Zusammenhang. Gemessen wurde, wie die Menschen über ihr Zuhause sprachen, nicht die tatsächliche Menge an Dingen. Vielleicht beschreiben gestresste Menschen ihre Wohnung auch nur negativer. Bei den Männern zeigte sich das Muster nicht.",
  src:"Saxbe, D. E., & Repetti, R. (2010). No place like home: Home tours correlate with daily patterns of mood and cortisol. Personality and Social Psychology Bulletin, 36(1), 71–81.",
  u:"https://doi.org/10.1177/0146167209352864",
  ev:1, typ:"Beobachtung",
  tip:"Das kann heißen: Wie du über dein Zuhause denkst, hängt vielleicht mit deinem Stress zusammen. Was die Ursache ist, zeigt diese Studie nicht.",
  myth:false },

{ id:"i09", cat:"wo",
  t:"Unordnung und das Gefühl, zu Hause zu sein",
  x:"Im Jahr 2016 befragten Roster, Ferrari und Jurkat 1.394 Erwachsene aus den USA und Kanada. Sie wurden über einen Verband für Ordnungshilfe gewonnen, die meisten waren Frauen, im Mittel 54 Jahre alt. Wer mehr Unordnung angab, fühlte sich in der eigenen Wohnung weniger zu Hause. Fachleute nennen das „psychologisches Zuhause“. Dieses Gefühl hing wiederum mit höherer Zufriedenheit zusammen. Wer sich mit seinen Dingen verbunden fühlte, hatte dieses Gefühl dagegen eher stärker.",
  c:"Die Stichprobe ist nicht repräsentativ, das sagen die Autoren selbst. Es war eine einmalige Befragung, Ursache und Wirkung lassen sich daraus nicht ablesen. Wer mit sich unzufrieden ist, bewertet vielleicht auch die Wohnung strenger.",
  src:"Roster, C. A., Ferrari, J. R., & Jurkat, M. P. (2016). The dark side of home: Assessing possession „clutter“ on subjective well-being. Journal of Environmental Psychology, 46, 32–41.",
  u:"https://doi.org/10.1016/j.jenvp.2016.03.003",
  ev:1, typ:"Beobachtung",
  tip:"Vielleicht geht es weniger um wenige Dinge als um das Gefühl, dass die Wohnung zu dir passt. Dinge, die du magst, dürfen dabei bleiben.",
  s:"Vielleicht geht es weniger um wenige Dinge als darum, dass dein Zimmer zu dir passt. Über gemeinsame Räume entscheidet die ganze Familie.",
  myth:false },

{ id:"i10", cat:"wo",
  t:"Gegenposition: Macht Unordnung kreativ?",
  x:"Im Jahr 2013 setzten Vohs, Redden und Rahinel 48 Studierende in ein ordentliches oder ein unordentliches Büro. Sie sollten neue Verwendungen für Tischtennisbälle finden. Die Zahl der Ideen war gleich. Unabhängige Fachleute bewerteten die Ideen aus dem unordentlichen Raum aber als kreativer. In einem anderen Versuch spendeten Menschen im ordentlichen Raum mehr Geld. Dort griffen 67 Prozent zum Apfel statt zur Schokolade, im unordentlichen Raum nur 20 Prozent.",
  c:"Manzi und Kollegen wiederholten den Kreativitätsversuch 2019 mit 100 Personen, also doppelt so vielen. Sie fanden keinen Unterschied zwischen ordentlichem und unordentlichem Raum. Die ursprünglichen Gruppen waren sehr klein. Der Befund gilt deshalb als wackelig.",
  src:"Vohs, K. D., Redden, J. P., & Rahinel, R. (2013). Physical order produces healthy choices, generosity, and conventionality, whereas disorder produces creativity. Psychological Science, 24(9), 1860–1867. Manzi und Kollegen (2019). Workspace disorder does not influence creativity and executive functions. Frontiers in Psychology, 9, 2662.",
  u:"https://doi.org/10.1177/0956797613480186",
  links:[{n:"Manzi und Kollegen 2019",u:"https://doi.org/10.3389/fpsyg.2018.02662"}],
  ev:1, typ:"Experiment",
  tip:"Das kann heißen: Für Kreativität spielt die Ordnung im Raum vielleicht keine große Rolle. Wenn dir ein voller Schreibtisch beim Arbeiten hilft, musst du ihn nicht leer räumen.",
  myth:false },

{ id:"i11", cat:"pa",
  t:"Was im Blickfeld liegt, konkurriert um Aufmerksamkeit",
  x:"McMains und Kastner untersuchten 2011 zehn Erwachsene im Hirnscanner. Ein solcher Scanner zeigt, welche Bereiche gerade arbeiten. Die Versuchspersonen sahen mehrere Formen gleichzeitig. In vier Bereichen der Sehrinde hemmten sich die Formen gegenseitig: Jede bekam weniger Verarbeitung, als wenn sie allein zu sehen war. Waren die Formen zu einem geordneten Ganzen gruppiert, war die Konkurrenz kleiner. Gezielte Aufmerksamkeit half am meisten, wenn das Bild ungeordnet war.",
  c:"Die Studie ist Grundlagenforschung mit nur zehn Personen und einfachen Formen auf einem Bildschirm. Wohnungen, Schreibtische oder Konzentration im Alltag wurden nicht untersucht. Die oft gehörte Aussage „Unordnung macht unkonzentriert“ geht über diesen Befund hinaus.",
  src:"McMains, S., & Kastner, S. (2011). Interactions of top-down and bottom-up mechanisms in human visual cortex. Journal of Neuroscience, 31(2), 587–597.",
  u:"https://doi.org/10.1523/JNEUROSCI.3766-10.2011",
  ev:1, typ:"Experiment",
  tip:"Das kann heißen: Ein ruhiger Bereich vor deinen Augen erleichtert es dem Gehirn vielleicht, bei einer Sache zu bleiben. Ob das bei dir so ist, kannst du ausprobieren.",
  myth:false },

{ id:"i12", cat:"ko",
  t:"Materialismus und Wohlbefinden: was viele Studien zeigen",
  x:"Materialismus heißt hier: Besitz, Geld und Status sind einem Menschen besonders wichtig. Dittmar und Kollegen werteten 2014 151 Veröffentlichungen mit 259 Stichproben aus. Im Mittel hing mehr Materialismus mit etwas geringerem Wohlbefinden zusammen. Der Zusammenhang war schwach, aber beständig: Die Kennzahl dafür (Korrelation) lag bei minus 0,15. Null hieße kein Zusammenhang, minus 1 ein vollständiger. Deutlich stärker war er bei riskantem Kaufverhalten und schlechtem Selbstbild. Bei der Lebenszufriedenheit war er am schwächsten.",
  c:"Fast alle Studien waren Querschnitte, also einmalige Befragungen. Experimente schlossen die Autoren aus, weil es zu wenige gab. Ob Materialismus unglücklich macht oder Unglückliche materialistischer werden, bleibt offen. Die Autoren vermuten, dass unerfüllte Grundbedürfnisse dazwischenliegen.",
  src:"Dittmar, H., Bond, R., Hurst, M., & Kasser, T. (2014). The relationship between materialism and personal well-being: A meta-analysis. Journal of Personality and Social Psychology, 107(5), 879–924.",
  u:"https://doi.org/10.1037/a0037409",
  ev:3, typ:"Übersicht",
  tip:"Das kann heißen: Nicht der Besitz an sich ist das Problem, sondern wie wichtig er dir wird. Wenn Haben viel Raum im Kopf einnimmt, lohnt ein Blick darauf.",
  myth:false },

{ id:"i13", cat:"ko",
  t:"Lassen sich materialistische Werte ändern?",
  x:"Kasser und Kollegen berichteten 2014 von drei Langzeitstudien in den USA und in Island. Sie begleiteten Menschen über 12 Jahre, 2 Jahre und 6 Monate. Wurden Geld, Besitz und Ansehen jemandem weniger wichtig, stieg sein Wohlbefinden. Wurden sie wichtiger, sank es. In einem Experiment besuchten Jugendliche mit stark materialistischen Werten drei Treffen von je drei Stunden. Dort ging es um Werbung und eigene Werte. Danach waren sie weniger materialistisch, und ihr Selbstwert stieg über mehrere Monate.",
  c:"Alle vier Studien stammen aus einem Forschungsverbund. Das Experiment war klein, die genaue Teilnehmerzahl ließ sich nicht nachprüfen. Werte sind nicht festgeschrieben, aber eine einzelne Kursreihe ist noch kein sicherer Beleg für eine Wirkung.",
  src:"Kasser, T., Rosenblum, K. L., Sameroff, A. J., Deci, E. L., Niemiec, C. P., Ryan, R. M., Árnadóttir, O., Bond, R., Dittmar, H., Dungan, N., & Hawks, S. (2014). Changes in materialism, changes in psychological well-being: Evidence from three longitudinal studies and an intervention experiment. Motivation and Emotion, 38(1), 1–22.",
  u:"https://doi.org/10.1007/s11031-013-9371-4",
  ev:1, typ:"Experiment",
  tip:"Das kann heißen: Was dir wichtig ist, kann sich verschieben. Nachdenken über eigene Werte und über Werbung ist vielleicht ein Anfang, keine Garantie.",
  myth:false },

{ id:"i14", cat:"ko",
  t:"Einfacher leben, zufriedener und umweltfreundlicher?",
  x:"Im Jahr 2005 verglichen Brown und Kasser 200 Menschen, die freiwillig einfach leben, mit 200 ähnlichen Menschen ohne diesen Lebensstil. Freiwillige Einfachheit heißt: weniger verdienen und kaufen, um mehr Zeit für Wichtiges zu haben. Die Einfach-Lebenden waren etwas zufriedener mit ihrem Leben, im Mittel 4,47 gegen 4,23 Punkte. Sie verhielten sich auch umweltfreundlicher. Auch in einer zweiten Studie mit Jugendlichen gingen Zufriedenheit und umweltfreundliches Verhalten Hand in Hand.",
  c:"Die Einfach-Lebenden meldeten sich selbst und hatten öfter einen Hochschulabschluss. Es war eine einmalige Befragung. Vielleicht wählen zufriedene Menschen eher diesen Lebensstil, statt durch ihn zufriedener zu werden. Der Unterschied ist klein.",
  src:"Brown, K. W., & Kasser, T. (2005). Are psychological and ecological well-being compatible? The role of values, mindfulness, and lifestyle. Social Indicators Research, 74(2), 349–368.",
  u:"https://doi.org/10.1007/s11205-004-8207-8",
  ev:1, typ:"Beobachtung",
  tip:"Vielleicht schließen sich weniger Konsum und ein gutes Leben nicht aus. Die Studie zeigt aber nicht, dass Verzicht automatisch glücklicher macht.",
  myth:false },

{ id:"i15", cat:"ko",
  t:"Was sagt die Forschung zu Minimalismus selbst?",
  x:"Hook und Kollegen sammelten 23 Studien zu Minimalismus und freiwilliger Einfachheit. Fast alle fanden einen positiven Zusammenhang mit Wohlbefinden. Die Autoren vermuten zwei Gründe: Man kontrolliert seine Kaufwünsche besser, und Grundbedürfnisse wie Selbstbestimmung, Können und Verbundenheit werden eher erfüllt. Ob der Effekt gilt, hängt möglicherweise vom Einkommen ab und davon, ob man sich selbst für das einfache Leben entschieden hat.",
  c:"Eine frühere Übersicht von Rich und Kollegen (2017) fand keine einzige Langzeit- oder Experimentalstudie. Die meisten Befragten waren Menschen aus reichen Ländern, die sich online selbst meldeten. Der Zusammenhang ist beständig, die Ursache aber ungeklärt.",
  src:"Hook, J. N., Hodge, A. S., Zhang, H., Van Tongeren, D. R., & Davis, D. E. (2023). Minimalism, voluntary simplicity, and well-being: A systematic review of the empirical literature. The Journal of Positive Psychology, 18(1), 130–141.",
  u:"https://doi.org/10.1080/17439760.2021.1991450",
  ev:2, typ:"Übersicht",
  tip:"Das kann heißen: Minimalismus passt zu einem guten Leben, ist aber kein bewiesenes Rezept. Freiwilligkeit scheint wichtig zu sein. Verzicht aus Not ist etwas anderes.",
  myth:false },

{ id:"i16", cat:"er",
  t:"Dinge als Teil von uns selbst",
  x:"Der Konsumforscher Russell Belk beschrieb 1988 die Idee vom „erweiterten Selbst“. Danach zählen wir manche Dinge zu uns selbst, so wie unseren Körper oder unsere Erinnerungen. Ein Erbstück, eine Sammlung oder ein altes Fahrrad erzählen, wer wir waren und sind. Verliert man solche Dinge, fühlt es sich an, als ginge ein Stück von einem selbst verloren. Das erklärt, warum Weggeben manchmal wehtut, auch wenn das Ding kaum Geldwert hat.",
  c:"Belks Arbeit ist eine Theorie, keine Messung. Sie wurde sehr oft zitiert und auch kritisiert, weil der Begriff schwer abzugrenzen ist. Spätere Experimente wie das von Winterich und Kollegen (2017) stützen einen Teil davon: Ein Foto verringerte das Gefühl des Selbstverlusts.",
  src:"Belk, R. W. (1988). Possessions and the extended self. Journal of Consumer Research, 15(2), 139–168.",
  u:"https://doi.org/10.1086/209154",
  ev:0, typ:"Idee",
  tip:"Das kann heißen: Wenn dir Weggeben schwerfällt, ist das kein Fehler. Es kann helfen, zu benennen, welchen Teil von dir ein Ding trägt, und zu prüfen, ob es diesen Teil noch braucht.",
  myth:false },

{ id:"i17", cat:"wo",
  t:"Wo Besitz sinnvoll ist: Dinge, die dich fähig machen",
  x:"Die Selbstbestimmungstheorie nennt drei Grundbedürfnisse: Selbstbestimmung (Autonomie), das Gefühl, etwas zu können (Kompetenz), und Verbundenheit. Im Jahr 2015 befragten Chen und Kollegen 1.051 Menschen in Belgien, China, Peru und den USA. In allen vier Ländern gingen erfüllte Selbstbestimmung, Kompetenz und Verbundenheit mit mehr Lebendigkeit einher. Wurden die Bedürfnisse blockiert, gab es mehr depressive Beschwerden. Das galt auch für Menschen, denen die Bedürfnisse nach eigener Aussage nicht so wichtig waren.",
  c:"Die Studie misst Bedürfnisse, nicht Besitz. Dass Werkzeuge oder ein Fahrrad sie erfüllen, ist hier unsere Übertragung. Direkter ist ein anderer Befund: Dinge, mit denen man etwas tut, machten in Befragungen ähnlich froh wie Erlebnisse (Impuls „Dinge, mit denen du etwas tust“).",
  src:"Chen, B., Vansteenkiste, M., Beyers, W., Boone, L., Deci, E. L., Van der Kaap-Deeder, J., Duriez, B., Lens, W., Matos, L., Mouratidis, A., Ryan, R. M., Sheldon, K. M., Soenens, B., Van Petegem, S., & Verstuyf, J. (2015). Basic psychological need satisfaction, need frustration, and need strength across four cultures. Motivation and Emotion, 39(2), 216–236.",
  u:"https://doi.org/10.1007/s11031-014-9450-1",
  ev:0, typ:"Idee",
  tip:"Das kann heißen: Ein Ding, mit dem du etwas selbst machen oder lernen kannst, verdient vielleicht einen Ehrenplatz. Die Frage ist, ob du es wirklich benutzt.",
  s:"Das kann heißen: Ein Werkzeug, ein Instrument oder ein Rad, mit dem du selbst etwas schaffst, ist vielleicht wertvoller als vieles andere. Hauptsache, du nutzt es.",
  myth:false },

{ id:"i18", cat:"ko",
  t:"Zeit kaufen statt Dinge",
  x:"Im Jahr 2017 befragten Whillans und Kollegen 6.271 Menschen in den USA, Kanada, Dänemark und den Niederlanden. Etwa 28 Prozent gaben regelmäßig Geld aus, um Zeit zu sparen, etwa für Putzhilfe oder Lieferdienste. Sie waren im Mittel zufriedener. In einem Experiment bekamen 60 Berufstätige an zwei Wochenenden je 40 Dollar. Einmal kauften sie damit Zeit, einmal ein Ding. Nach dem Zeitkauf hatten sie bessere Laune und weniger Zeitdruck.",
  c:"Die großen Befragungen zeigen nur Zusammenhänge. Das Experiment war klein, und der Effekt war mäßig. Eine unabhängige Wiederholung ist uns nicht bekannt. Wer wenig Geld hat, kann sich Zeit oft nicht kaufen.",
  src:"Whillans, A. V., Dunn, E. W., Smeets, P., Bekkers, R., & Norton, M. I. (2017). Buying time promotes happiness. Proceedings of the National Academy of Sciences, 114(32), 8523–8527.",
  u:"https://doi.org/10.1073/pnas.1706541114",
  ev:1, typ:"Experiment",
  tip:"Das kann heißen: Vor einem Kauf lohnt die Frage, ob dir mehr Zeit nicht mehr bringen würde als ein weiteres Ding. Leihen oder Teilen spart manchmal beides.",
  s:"Das kann heißen: Freie Zeit ist auch ein Wert. Statt etwas zu kaufen, kannst du überlegen, wofür du die Zeit nutzen möchtest, die du sonst mit Shoppen verbringst.",
  myth:false },

{ id:"i19", cat:"ko",
  t:"Geld für andere ausgeben",
  x:"Im Jahr 2008 gaben Dunn, Aknin und Norton 46 Studierenden morgens 5 oder 20 Dollar. Die eine Hälfte sollte das Geld bis zum Abend für sich ausgeben, die andere für andere Menschen. Wer für andere ausgab, war abends glücklicher. In einer Befragung von 632 Menschen in den USA hing Ausgeben für andere ebenfalls mit mehr Glück zusammen.",
  c:"Kim und Kollegen wiederholten das Experiment 2022 mit 133 Personen. Mit der ursprünglichen Auswertung fanden sie keinen bedeutsamen Unterschied, mit einem direkteren Glücksmaß schon. Aknin und Kollegen fanden 2020 bei 712 Studierenden einen Effekt, bei 1.950 Erwachsenen keinen und bei 5.199 Personen nur einen kleinen.",
  src:"Dunn, E. W., Aknin, L. B., & Norton, M. I. (2008). Spending money on others promotes happiness. Science, 319(5870), 1687–1688. Aknin, L. B., Dunn, E. W., Proulx, J., Lok, I., & Norton, M. I. (2020). Does spending money on others promote happiness?: A registered replication report. Journal of Personality and Social Psychology, 119(2), e15–e26. Kim, G., Adams, I., Diaw, M., Celly, M., Nelson, L. D., & Jung, M. H. (2022). Prosocial spending encourages happiness: A replication of the only experiment reported in Dunn, Aknin, and Norton (2008). PLOS ONE, 17(9), e0272434.",
  u:"https://doi.org/10.1126/science.1150952",
  links:[{n:"Aknin und Kollegen 2020",u:"https://doi.org/10.1037/pspa0000191"},{n:"Kim und Kollegen 2022",u:"https://doi.org/10.1371/journal.pone.0272434"}],
  ev:1, typ:"Experiment",
  tip:"Vielleicht macht Schenken etwas froher, aber der Effekt ist kleiner als oft behauptet. Ob das Weitergeben gebrauchter Dinge ähnlich wirkt, wurde nicht untersucht. Das ist nur unsere Vermutung.",
  myth:false },

{ id:"i20", cat:"ko",
  t:"Frustkauf: Hilft Shoppen gegen schlechte Laune?",
  x:"Rick, Pereira und Burson zeigten 2014 Menschen traurige Filmszenen. Danach wählten 100 Erwachsene entweder vier Produkte zum gedachten Kauf aus oder sahen sich die Produkte nur an. Wer wählte, war danach weniger traurig: Die verbliebene Traurigkeit lag bei 2,9 statt 8,1 Punkten auf einer Skala bis 100. Die Autoren erklären das mit Kontrolle: Entscheiden gibt das Gefühl zurück, etwas selbst zu bestimmen. Gegen Wut half das Auswählen nicht.",
  c:"Die Gefühle waren mild und kurz, der Kauf meist nur gedacht. Ob sich die Laune später durch Schulden oder Reue wieder verschlechtert, prüften die Forschenden nicht. Sie nennen das selbst eine offene Frage. Kaufsucht wurde nicht untersucht.",
  src:"Rick, S. I., Pereira, B., & Burson, K. A. (2014). The benefits of retail therapy: Making purchase decisions reduces residual sadness. Journal of Consumer Psychology, 24(3), 373–380.",
  u:"https://doi.org/10.1016/j.jcps.2013.12.004",
  ev:1, typ:"Experiment",
  tip:"Das kann heißen: Wenn du traurig bist, hilft dir vielleicht das Gefühl, etwas zu entscheiden. Das geht auch ohne Kauf, etwa indem du einen Wunsch nur notierst und parkst.",
  myth:false },

{ id:"i21", cat:"ko",
  t:"Kaufsucht: Wie verbreitet ist sie?",
  x:"Bei einer Kaufsucht kann ein Mensch das Kaufen kaum noch steuern, obwohl es ihm schadet, zum Beispiel durch Schulden oder Streit. Im Jahr 2016 werteten Maraz, Griffiths und Demetrovics 40 Studien aus 16 Ländern mit zusammen etwa 32.000 Teilnehmenden aus. In repräsentativen Befragungen Erwachsener lag der Anteil bei etwa 4,9 Prozent. Bei Studierenden waren es 8,3 Prozent. Jüngere Menschen und Frauen waren häufiger betroffen.",
  c:"Die Schätzungen schwanken stark, je nach Fragebogen. Fragebögen geben nur Hinweise, keine Diagnose. In der ICD-11, dem Diagnose-Handbuch der Weltgesundheitsorganisation, ist Kaufsucht keine eigene Diagnose. Sie wird dort unter den sonstigen Impulskontrollstörungen geführt (Code 6C7Y). Eine Diagnose stellen nur Fachleute.",
  src:"Maraz, A., Griffiths, M. D., & Demetrovics, Z. (2016). The prevalence of compulsive buying: A meta-analysis. Addiction, 111(3), 408–419. Zur Einordnung in der ICD-11: Eliyahu, S., Rahamim, S., Natan, N., & Weinstein, A. M. (2025). Impulsivity and compulsivity in compulsive buying. Frontiers in Psychiatry.",
  u:"https://doi.org/10.1111/add.13223",
  links:[{n:"Eliyahu und Kollegen 2025 (ICD-11)",u:"https://doi.org/10.3389/fpsyt.2025.1665182"}],
  ev:2, typ:"Übersicht",
  tip:"Wenn Kaufen dich belastet und du es nicht steuern kannst, bist du damit nicht allein. Es gibt Hilfe, etwa in der Hausarztpraxis oder bei einer Suchtberatung, auch anonym.",
  s:"Wenn Kaufen dich belastet und du nicht aufhören kannst, bist du nicht allein. Sprich mit einer Vertrauensperson, in der Hausarztpraxis oder bei einer Suchtberatung.",
  myth:false }
];

{ id:"q04", q:"Ein Paar Schuhe war teuer, drückt aber. Welcher Grund zum Behalten hält der Forschung zu versunkenen Kosten am wenigsten stand?",

{ id:"q05", q:"Was zeigt die Feldstudie mit Spenden in Wohnheimen?",
  o:["In Häusern mit Foto-Hinweis kamen etwas mehr Spenden zusammen: 613 statt 533 Dinge.","Fotos machten das Weggeben schwerer, weil die Erinnerung lebendig wurde.","Fotos halfen vor allem beim Verkaufen von Dingen."],

{ id:"q06", q:"Jemand sagt: „Studien beweisen, dass Unordnung kreativ macht.“ Was stimmt?",

{ id:"q07", q:"Eine Metaanalyse fand bei Materialismus und Wohlbefinden eine Kennzahl von etwa minus 0,15. Wie lässt sich das am besten lesen?",

{ id:"q08", q:"Was ist das ehrlichste Fazit zur Forschung über Minimalismus?",

{ id:"q09", q:"Wie steht es um den Befund, dass Geld für andere glücklicher macht als Geld für sich?",
