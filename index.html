const IMPULSE_B=[
{ id:"i22", cat:"wo",
  t:"Wenn Loslassen fast unmöglich wird: Horten als Störung",
  x:"Horten (früher oft „Messie-Syndrom“ genannt) ist mehr als Unordnung. Betroffene können Dinge kaum weggeben, auch wertlose, sodass sich Räume nicht mehr normal nutzen lassen. Seit 2013 steht die Störung im DSM-5, seit 2022 in der ICD-11, den beiden großen Diagnose-Handbüchern. Eine Auswertung von elf großen Erhebungen mit 53.378 Erwachsenen schätzt, dass etwa 2,5 Prozent betroffen sind. Unordnung allein ist keine Störung. Eine Diagnose stellen nur Fachleute.",
  c:"Behandlung hilft oft deutlich: Eine Metaanalyse von 2025 mit 41 Studien fand einen großen Rückgang der Beschwerden. Kognitive Verhaltenstherapie, die Denk- und Handlungsmuster übt, war nicht besser als andere psychologische Verfahren. Besserung braucht aber Zeit, und viele lagen nach der Behandlung noch über der Grenze zur Diagnose.",
  src:"Postlethwaite, A., Kellett, S., & Mataix-Cols, D. (2019). Prevalence of hoarding disorder: A systematic review and meta-analysis. Journal of Affective Disorders, 256, 309–316. O'Brien, E., & Laws, K. R. (2025). Decluttering minds: Psychological interventions for hoarding disorder. A systematic review and meta-analysis. Journal of Psychiatric Research, 181, 738–751.",
  u:"https://doi.org/10.1016/j.jad.2019.06.004",
  links:[{n:"O'Brien & Laws 2025 (Behandlung)",u:"https://doi.org/10.1016/j.jpsychires.2024.12.029"}],
  ev:3, typ:"Übersicht",
  tip:"Wenn das Aufräumen bei dir oder jemandem in deiner Nähe seit Jahren nicht gelingt und das Wohnen darunter leidet, ist das kein Charakterfehler. Hausarztpraxis, Psychotherapie oder eine Beratungsstelle können weiterhelfen.",
  s:"Machst du dir Sorgen um jemanden in deiner Familie, sprich mit einer Vertrauensperson, etwa der Vertrauenslehrkraft oder der Schulsozialarbeit. Du musst das nicht allein lösen.",
  myth:false },

{ id:"i23", cat:"ko",
  t:"Heiß und kalt: Warum Warten beim Kaufen hilft",
  x:"Der Ökonom George Loewenstein spricht von einer „Heiß-kalt-Empathielücke“: Im ruhigen, „kalten“ Zustand unterschätzen wir, wie stark uns Hunger, Lust oder Aufregung später lenken. In einem Feldexperiment wählten 200 Angestellte in Amsterdam einen Snack für die nächste Woche. Als es so weit war, durften sie umentscheiden. Von denen, die vorher Obst gewählt hatten, wechselten je nach Gruppe 62 bis 82 Prozent zu Schokolade, Chips oder Nüssen. Umgekehrt wechselten höchstens 8 Prozent.",
  c:"Die Studie ist alt und betrifft Essen, nicht Einkaufen. Verwandte Experimente zeigen, dass hungrige Menschen auch mehr Dinge mitnehmen, die man nicht essen kann, etwa Foldback-Klammern. Dass Wartezeiten Fehlkäufe verhindern, ist aus solchen Befunden abgeleitet, aber nicht direkt gemessen.",
  src:"Read, D., & van Leeuwen, B. (1998). Predicting hunger: The effects of appetite and delay on choice. Organizational Behavior and Human Decision Processes, 76(2), 189–205. Loewenstein, G. (2005). Hot-cold empathy gaps and medical decision making. Health Psychology, 24(4, Suppl.), S49–S56. Xu, A. J., Schwarz, N., & Wyer, R. S. (2015). Hunger promotes acquisition of nonfood objects. PNAS, 112(9), 2688–2692.",
  u:"https://doi.org/10.1006/obhd.1998.2803",
  links:[{n:"Loewenstein 2005",u:"https://doi.org/10.1037/0278-6133.24.4.S49"},{n:"Xu, Schwarz & Wyer 2015",u:"https://doi.org/10.1073/pnas.1417712112"}],
  ev:2, typ:"Experiment",
  tip:"Ein Kaufwunsch, der sich im Moment dringend anfühlt, sagt wenig darüber, wie du ihn in einer Woche siehst. Ein geparkter Wunsch gibt deinem ruhigen Ich eine Stimme.",
  myth:false },

{ id:"i24", cat:"ko",
  t:"Wenn-dann-Pläne machen Vorsätze wirksamer",
  x:"Ein Vorsatz wie „Ich will weniger kaufen“ scheitert oft im entscheidenden Moment. Ein Wenn-dann-Plan legt vorher fest, was du in einer bestimmten Lage tust: „Wenn ich eine Rabatt-Mail öffne, dann lösche ich sie sofort.“ Fachleute nennen das Durchführungsvorsatz. Eine Metaanalyse über 94 Tests fand einen mittleren bis großen Effekt auf das Erreichen von Zielen (d = 0,65). Das Maß d beschreibt, wie weit zwei Gruppen auseinanderliegen; 0,5 gilt als mittel, 0,8 als groß.",
  c:"Ältere Metaanalysen können Effekte überschätzen, weil erfolglose Studien seltener veröffentlicht werden. Eine neue Auswertung von 642 Tests fand je nach Art des Ziels Effekte zwischen d = 0,27 und d = 0,66. Wenn-dann-Pläne helfen also verlässlich, aber nicht überall gleich stark.",
  src:"Gollwitzer, P. M., & Sheeran, P. (2006). Implementation intentions and goal achievement: A meta-analysis of effects and processes. Advances in Experimental Social Psychology, 38, 69–119. Sheeran, P., Listrom, O., & Gollwitzer, P. M. (2025). The when and how of planning: Meta-analysis of the scope and components of implementation intentions in 642 tests. European Review of Social Psychology, 36(1), 162–194.",
  u:"https://doi.org/10.1016/S0065-2601(06)38002-1",
  links:[{n:"Sheeran, Listrom & Gollwitzer 2025",u:"https://doi.org/10.1080/10463283.2024.2334563"}],
  ev:3, typ:"Übersicht",
  tip:"Ein Plan, der eine konkrete Situation nennt, nimmt dir die Entscheidung im schwierigen Moment ab. Gerade bei Kaufreizen, die immer wiederkommen, kann sich so ein Satz lohnen.",
  myth:false },

{ id:"i25", cat:"ko",
  t:"Neustart-Effekt: Warum Montage und Monatsanfänge helfen",
  x:"Manche Tage fühlen sich wie ein Neuanfang an: ein Montag, ein Monatsanfang, ein neues Semester, ein Geburtstag. Dai, Milkman und Riis nennen sie 2014 „zeitliche Wegmarken“. Sie werteten Besuche in einem Fitnessstudio einer Universität aus. Zu Beginn einer Woche war ein Besuch um 33,4 Prozent wahrscheinlicher, zu Beginn eines Semesters um 47,1 Prozent. Bei Google suchten Menschen zu Jahresbeginn 82,1 Prozent häufiger nach dem Wort „Diät“ als an anderen Tagen.",
  c:"Die Daten sind Beobachtungen. Sie zeigen, wann Menschen mit etwas anfangen, aber nicht, ob sie länger dabeibleiben. Andere Gründe, etwa das Ende von Ferien, lassen sich nicht ganz ausschließen. Die Zahlen stammen aus den USA.",
  src:"Dai, H., Milkman, K. L., & Riis, J. (2014). The fresh start effect: Temporal landmarks motivate aspirational behavior. Management Science, 60(10), 2563–2582.",
  u:"https://doi.org/10.1287/mnsc.2014.1901",
  ev:2, typ:"Beobachtung",
  tip:"Ein Monatsanfang oder der erste Tag nach den Ferien kann ein guter Moment sein, um eine Übung zu beginnen. Verpasst du ihn, kommt die nächste Wegmarke bald.",
  myth:false },

{ id:"i26", cat:"kl",
  t:"Mehr als ein Drittel der Kleidung wird kaum getragen",
  x:"Greenpeace ließ im November 2025 in Deutschland 1.001 Menschen zwischen 18 und 69 Jahren online befragen. Im Schnitt besaßen sie 89,8 Kleidungsstücke, Unterwäsche und Socken nicht mitgezählt. Frauen hatten etwa 114 Teile, Männer etwa 66. Rund 36 Prozent des Bestands wurden selten oder fast nie getragen. „Selten“ hieß: seltener als einmal in drei Monaten. „Fast nie“ hieß: höchstens zweimal überhaupt. Knapp die Hälfte hatte noch nie selbst Kleidung repariert.",
  c:"Die Umweltorganisation Greenpeace hat die Umfrage in Auftrag gegeben. Die Zahlen beruhen auf Selbstauskunft, nicht auf Nachzählen. Frühere Greenpeace-Umfragen kamen auf ähnliche Größen: 95 Teile 2015, 87 Teile 2022. Unabhängig davon schätzte die britische Organisation WRAP 2012, dass etwa 30 Prozent der Kleidung seit einem Jahr ungetragen waren.",
  src:"Greenpeace e. V. (2025). Einstellungen zum Kleidungskonsum: Kleidungsbestand, Tragehäufigkeit und Lebensdauer. Online-Umfrage, durchgeführt von nuggets Market Research, n = 1.001. Hamburg: Greenpeace. WRAP (2012). Valuing our clothes: The true cost of how we design, use and dispose of clothing in the UK. Banbury: WRAP.",
  u:"https://www.greenpeace.de/publikationen/Einstellungen%20zum%20Kleidungskonsum.pdf",
  links:[{n:"WRAP 2012",u:"https://wrap.ngo/resources/report/valuing-our-clothes-true-cost-how-we-design-use-and-dispose-clothing-uk-2012"}],
  ev:2, typ:"Beobachtung",
  tip:"Wenn ein Drittel des Schranks kaum zum Einsatz kommt, ist das kein Versagen, sondern ein Hinweis. Zu wissen, was du wirklich trägst, kann den nächsten Kauf leichter machen.",
  s:"Schau in deinem Schrank, welche Teile du in den letzten drei Monaten getragen hast. Bevor du etwas weitergibst, das deine Eltern bezahlt haben, sprich kurz mit ihnen.",
  myth:false },

{ id:"i27", cat:"kl",
  t:"Kleidung wird heute kürzer genutzt",
  x:"Die Ellen MacArthur Foundation ist eine britische Stiftung für Kreislaufwirtschaft, also für ein Wirtschaften, bei dem Material lange im Umlauf bleibt. 2017 trug sie Daten zur weltweiten Mode zusammen. In 15 Jahren hat sich die Produktion von Kleidung etwa verdoppelt. Gleichzeitig wird ein Kleidungsstück im Schnitt 36 Prozent seltener getragen, bevor es aussortiert wird, in China sogar 70 Prozent seltener. Weniger als 1 Prozent des Materials wird zu neuer Kleidung recycelt.",
  c:"Der Bericht fasst viele Datenquellen zusammen und arbeitet mit Schätzungen und Modellrechnungen. Die Zahlen sind deshalb Größenordnungen, keine genauen Messwerte. Bildhaft rechnet der Bericht vor, dass jede Sekunde eine Müllwagenladung Textilien deponiert oder verbrannt wird.",
  src:"Ellen MacArthur Foundation (2017). A new textiles economy: Redesigning fashion's future. Cowes: Ellen MacArthur Foundation.",
  u:"https://www.ellenmacarthurfoundation.org/a-new-textiles-economy",
  ev:2, typ:"Übersicht",
  tip:"Jedes Mal, wenn du ein Teil noch einmal anziehst, steigt seine Nutzung. Das ist eine kleine, direkte Stellschraube, für die du nichts kaufen musst.",
  myth:false },

{ id:"i28", cat:"kl",
  t:"Länger tragen hilft, aber weniger als oft behauptet",
  x:"WRAP, eine britische Umweltorganisation, hat 2017 den Fußabdruck der Kleidung in Großbritannien berechnet. Der Fußabdruck ist die Umweltbelastung über das ganze Leben eines Produkts. Ein Kleidungsstück wird dort im Schnitt 3,3 Jahre genutzt. Würde die Hälfte aller Kleidung neun Monate länger getragen, sänken laut Bericht pro Tonne Kleidung der CO2-Ausstoß um 8 Prozent, der Wasserverbrauch um 10 Prozent und der Abfall um 4 Prozent. Der größte Einzelposten beim CO2 ist die Herstellung der Fasern.",
  c:"2012 nannte WRAP für neun Monate längeres Tragen noch 20 bis 30 Prozent weniger Belastung. Diese Zahl wird bis heute oft zitiert. Die Rechnung von 2017 nimmt nur die Hälfte der Kleidung an und kommt auf kleinere Werte. Beides sind Modellrechnungen, keine Messungen.",
  src:"WRAP (2017). Valuing our clothes: The cost of UK fashion. Banbury: WRAP. Zur älteren Angabe: WRAP (2012). Valuing our clothes: The true cost of how we design, use and dispose of clothing in the UK.",
  u:"https://www.wrap.ngo/resources/report/valuing-our-clothes-cost-uk-fashion",
  ev:2, typ:"Übersicht",
  tip:"Länger tragen ist ein Baustein, kein Wundermittel. Am meisten bewirkt es wohl dann, wenn dadurch ein Neukauf ganz wegfällt, denn die Herstellung wiegt schwer.",
  myth:false },

{ id:"i29", cat:"wo",
  t:"Beim Handy zählt fürs Klima vor allem die Herstellung",
  x:"Das Europäische Umweltbüro, ein Dachverband von Umweltorganisationen, hat 2019 den Klima-Fußabdruck von Geräten verglichen. Beim Smartphone entfallen etwa 72 Prozent auf Herstellung, Transport und Entsorgung, der Rest auf die Nutzung. Bei Notebooks sind es 52 Prozent, bei Waschmaschinen nur 25 Prozent. Würden alle Smartphones in der EU ein Jahr länger genutzt, ließen sich bis 2030 jährlich etwa 2,1 Millionen Tonnen CO2 sparen. Das entspricht laut Bericht über einer Million Autos.",
  c:"Die Zahlen hat das Europäische Umweltbüro selbst berechnet, ein Verband, der für längere Nutzung eintritt. Die Rechnung ist eine Modellrechnung und vereinfacht stark. Die Europäische Umweltagentur, eine EU-Behörde, kommt in dieselbe Richtung: Viele Geräte werden mindestens 2,3 Jahre kürzer genutzt, als sie gebaut sind.",
  src:"European Environmental Bureau (2019). Coolproducts don't cost the earth: Report briefing. Brüssel: EEB. Europäische Umweltagentur (2020). Europe's consumption in a circular economy: The benefits of longer-lasting electronics (Briefing Nr. 02/2020). Kopenhagen: EEA.",
  u:"https://eeb.org/wp-content/uploads/2019/09/Coolproducts-briefing.pdf",
  links:[{n:"Europäische Umweltagentur 2020",u:"https://www.eea.europa.eu/en/analysis/publications/europes-consumption-in-a-circular-economy-the-benefits-of-longer-lasting-electronics"}],
  ev:1, typ:"Übersicht",
  tip:"Bei Geräten mit Akku bringt es fürs Klima oft mehr, sie reparieren zu lassen oder gebraucht zu kaufen, als auf ein sparsameres neues zu wechseln. Bei großen Stromverbrauchern kann das anders aussehen.",
  s:"Dein Handy länger zu nutzen, etwa mit Schutzhülle oder neuem Akku statt neuem Gerät, bewirkt mehr, als man denkt. Ob sich eine Reparatur lohnt, klärst du am besten mit deinen Eltern.",
  myth:false },

{ id:"i30", cat:"ko",
  t:"Mythos: „Eine Bohrmaschine wird nur 13 Minuten benutzt“",
  x:"Der Satz verbreitete sich mit der Idee des Teilens über Internet-Plattformen. 2007 schrieb der Autor Alex Steffen, eine Bohrmaschine werde „angeblich“ sechs bis zwanzig Minuten im ganzen Leben benutzt. 2010 nannte Rachel Botsman bei einem TEDx-Vortrag 12 bis 15 Minuten. 2013 sagte der Airbnb-Gründer Brian Chesky in der New York Times, 80 Millionen Bohrmaschinen in den USA liefen im Schnitt 13 Minuten. Eine Messung wird in keiner dieser Quellen genannt.",
  c:"Es gibt keine gute Zahl. Schon unklar ist, was zählt: nur die Sekunden des Bohrens oder die ganze Arbeit? Der Autor Tom Slee weist darauf hin, dass sich das Verleihen von Werkzeug über Plattformen kaum durchgesetzt hat, weil Leihen umständlich ist. Dass manche Geräte selten laufen, bleibt trotzdem plausibel.",
  src:"Slee, T. (2015, 16. September). The case of the power drill [Blogbeitrag], mit den Zitaten von Botsman (TEDxSydney 2010) und Chesky (in: Friedman, T. L., 2013, Welcome to the „sharing economy“, The New York Times). Zu Steffen (2007): Workshopshed (2016, 21. Januar). Drills only used for 10 minutes [Blogbeitrag].",
  u:"https://tomslee.net/posts/2015-09-16-the-case-of-the-power-drill/index.html",
  ev:1, typ:"Idee",
  tip:"Ob ein Gerät für dich sinnvoll ist, zeigt eher deine eigene Erfahrung: Wie oft hast du es im letzten Jahr gebraucht, und wäre Leihen wirklich einfacher gewesen?",
  myth:true },

{ id:"i31", cat:"wo",
  t:"Mythos: „Jeder Mensch besitzt 10.000 Dinge“",
  x:"Die Zahl steht in vielen Ratgebern, oft mit Verweis auf das Statistische Bundesamt. Eine solche Veröffentlichung des Amtes ließ sich nicht finden. In den USA kursiert sogar die Zahl 300.000 Dinge pro Haushalt; sie geht auf Aussagen von Aufräumberatern zurück, nicht auf eine Studie. Eine echte Zählung ist kleiner und genauer: Forschende aus Los Angeles zählten bei einer Familie 2.260 sichtbare Gegenstände in zwei Schlafzimmern und dem Wohnzimmer. Schubladen, Kisten und Schränke zählten sie nicht mit.",
  c:"Es gibt keine belastbare Durchschnittszahl. Schon offen ist, was ein „Ding“ ist: Zählt jede Büroklammer einzeln? Die Zählung aus Los Angeles stammt aus einer Studie mit 32 Familien und ist nicht repräsentativ. Sie zeigt aber, dass schon wenige Räume Tausende Dinge fassen können.",
  src:"Arnold, J. E., Graesch, A. P., Ragazzini, E., & Ochs, E. (2012). Life at home in the twenty-first century: 32 families open their doors. Los Angeles: Cotsen Institute of Archaeology Press. Zur 10.000er-Zahl: Der Standard, „Besitzen wir wirklich 10.000 Dinge?“ (online, ohne Autor und Datum gefunden).",
  u:"https://anthro.ucla.edu/publication/life-at-home-in-the-twenty-first-century-32-families-open-their-doors",
  links:[{n:"Der Standard: Besitzen wir wirklich 10.000 Dinge?",u:"https://www.derstandard.at/story/2000132723089/besitzen-wir-wirklich-10-000-dinge"}],
  ev:1, typ:"Beobachtung",
  tip:"Statt dich an einer fremden Zahl zu messen, kannst du eine einzige Schublade durchzählen. Das Ergebnis sagt mehr über deinen Alltag als jeder Durchschnitt.",
  myth:true },

{ id:"i32", cat:"ko",
  t:"Zu viel Auswahl lähmt? Nur unter bestimmten Bedingungen",
  x:"Berühmt wurde ein Versuch im Supermarkt: An einem Stand mit 24 Marmeladen kauften weniger Menschen als an einem Stand mit 6 Sorten. Eine Metaanalyse über 50 Experimente mit 5.036 Teilnehmenden fand aber im Mittel praktisch keinen Effekt, bei großen Unterschieden zwischen den Studien. Eine zweite Metaanalyse mit 7.202 Teilnehmenden fand Überforderung vor allem dann, wenn die Aufgabe schwierig ist, die Angebote kompliziert sind, man nicht weiß, was man will, oder schnell fertig werden möchte.",
  c:"Die beiden Auswertungen widersprechen sich nur scheinbar. Viel Auswahl schadet nicht grundsätzlich, kann aber unter bestimmten Umständen überfordern. Welche Bedingungen genau den Ausschlag geben, ist noch nicht abschließend geklärt.",
  src:"Scheibehenne, B., Greifeneder, R., & Todd, P. M. (2010). Can there ever be too many options? A meta-analytic review of choice overload. Journal of Consumer Research, 37(3), 409–425. Chernev, A., Böckenholt, U., & Goodman, J. (2015). Choice overload: A conceptual review and meta-analysis. Journal of Consumer Psychology, 25(2), 333–358.",
  u:"https://doi.org/10.1086/651235",
  links:[{n:"Chernev, Böckenholt & Goodman 2015",u:"https://doi.org/10.1016/j.jcps.2014.08.002"}],
  ev:2, typ:"Übersicht",
  tip:"Wenn du noch nicht weißt, was du suchst, kann eine lange Liste von Angeboten anstrengen. Vorher aufzuschreiben, was dir wichtig ist, macht die Liste kürzer.",
  myth:false },

{ id:"i33", cat:"er",
  t:"Nostalgie: Warum Erinnern guttun kann",
  x:"Nostalgie ist die wehmütige, meist warme Erinnerung an früher, oft an Menschen und besondere Ereignisse. In einer Befragung von Studierenden gaben 79 Prozent an, mindestens einmal pro Woche nostalgisch zu sein. In sieben Studien zeigte das Team um Tim Wildschut und Constantine Sedikides: Nostalgie tritt oft auf, wenn man traurig oder einsam ist. Danach stärkt sie das Gefühl, mit anderen verbunden zu sein, und hebt Stimmung und Selbstwertgefühl.",
  c:"Viele Studien stammen von derselben Forschungsgruppe und arbeiten mit Studierenden. Es gibt aber Wiederholungen in anderen Ländern, etwa in China. Untersucht wurden vor allem Erinnerungen an Menschen und Ereignisse. Ob man dafür Gegenstände braucht, wurde kaum geprüft.",
  src:"Wildschut, T., Sedikides, C., Arndt, J., & Routledge, C. (2006). Nostalgia: Content, triggers, functions. Journal of Personality and Social Psychology, 91(5), 975–993. Routledge, C., Wildschut, T., Sedikides, C., & Juhl, J. (2013). Nostalgia as a resource for psychological health and well-being. Social and Personality Psychology Compass, 7(11), 808–818.",
  u:"https://doi.org/10.1037/0022-3514.91.5.975",
  ev:2, typ:"Experiment",
  tip:"Erinnerungsstücke können Nostalgie auslösen und damit guttun. Da sich nostalgische Erinnerungen meist um Menschen drehen, liegt es nahe, vor allem Stücke zu behalten, die dich an Menschen erinnern.",
  myth:false },

{ id:"i34", cat:"pa",
  t:"Wer alles fotografiert, erinnert sich schlechter",
  x:"Die Psychologin Linda Henkel führte Studierende durch ein Kunstmuseum. Manche Objekte sollten sie nur ansehen, andere fotografieren. Später erinnerten sie sich an Details der fotografierten Objekte schlechter: Sie beantworteten 55 statt 64 Prozent der Fragen richtig. Fachleute nennen das den Foto-Nachteil fürs Gedächtnis. In einer zweiten Studie verschwand der Nachteil, wenn die Teilnehmenden gezielt einen Ausschnitt heranzoomten, also genauer hinschauten.",
  c:"Die Studien waren klein, mit 27 und 46 Teilnehmenden. Eine andere Forschungsgruppe fand den Nachteil wieder, sogar wenn die Fotos sofort gelöscht wurden. Das spricht eher für fehlende Aufmerksamkeit als für „Das Handy merkt es sich ja“. Der Zoom-Befund ist weniger gut abgesichert.",
  src:"Henkel, L. A. (2014). Point-and-shoot memories: The influence of taking photos on memory for a museum tour. Psychological Science, 25(2), 396–402. Soares, J. S., & Storm, B. C. (2018). Forget in a flash: A further investigation of the photo-taking-impairment effect. Journal of Applied Research in Memory and Cognition, 7(1), 154–160.",
  u:"https://doi.org/10.1177/0956797613504438",
  links:[{n:"Soares & Storm 2018",u:"https://doi.org/10.1016/j.jarmac.2017.10.004"}],
  ev:2, typ:"Experiment",
  tip:"Ein Foto ersetzt nicht das Hinschauen. Ist dir ein Moment wichtig, kann es helfen, erst bewusst zu schauen und danach vielleicht ein einziges Bild zu machen.",
  myth:false },

{ id:"i35", cat:"pa",
  t:"Macht das Handy auf dem Tisch unkonzentriert? Eher wenig",
  x:"2017 ließ ein Team um Adrian Ward 520 Studierende Aufgaben zum Arbeitsgedächtnis und zum logischen Denken lösen. Das Arbeitsgedächtnis hält Informationen kurz bereit, etwa eine Telefonnummer. Das eigene Handy lag dabei auf dem Tisch, in Tasche oder Hosentasche oder in einem anderen Raum. Wer es im anderen Raum hatte, schnitt am besten ab. Die Studie wurde unter dem Namen „Brain Drain“ bekannt und sehr oft zitiert.",
  c:"Eine genaue Wiederholung von 2022 fand keinen Unterschied. Eine Metaanalyse über 56 Studien mit 7.093 Teilnehmenden fand nur beim Arbeitsgedächtnis einen kleinen Nachteil, bei anderen Fähigkeiten keinen. Der Effekt ist also kleiner als behauptet und unsicher.",
  src:"Ward, A. F., Duke, K., Gneezy, A., & Bos, M. W. (2017). Brain drain: The mere presence of one's own smartphone reduces available cognitive capacity. Journal of the Association for Consumer Research, 2(2), 140–154. Ruiz Pardo, A. C., & Minda, J. P. (2022). Reexamining the „brain drain“ effect: A replication of Ward et al. (2017). Acta Psychologica, 230, 103717. Parry, D. A. (2024). Does the mere presence of a smartphone impact cognitive performance? A meta-analysis of the „brain drain effect“. Media Psychology, 27(5), 737–762.",
  u:"https://doi.org/10.1086/691462",
  links:[{n:"Ruiz Pardo & Minda 2022",u:"https://doi.org/10.1016/j.actpsy.2022.103717"},{n:"Parry 2024",u:"https://doi.org/10.1080/15213269.2023.2286647"}],
  ev:1, typ:"Experiment",
  tip:"Das Handy beim Lernen wegzulegen schadet nicht, auch wenn der Effekt kleiner ist als gedacht. Ob es dir hilft, zeigt ein eigener Versuch: eine Woche im Flur, eine Woche auf dem Tisch.",
  myth:false },

{ id:"i36", cat:"ko",
  t:"Werbung, Unzufriedenheit und der Wunsch nach Dingen",
  x:"Forscherinnen aus Amsterdam befragten 466 Kinder zwischen 8 und 11 Jahren zweimal, im Abstand von einem Jahr. Materialismus meint hier die Überzeugung, dass Besitz glücklich und beliebt macht. Materialismus machte die Kinder später nicht unzufriedener. Umgekehrt wurden Kinder, die mit ihrem Leben weniger zufrieden waren, materialistischer, aber nur, wenn sie viel Werbung sahen. Eine zweite Auswertung fand: Kinder, die mehr Fernsehwerbung sahen, wünschten sich die beworbenen Produkte stärker und waren ein Jahr später materialistischer.",
  c:"Beide Auswertungen beruhen auf Selbstauskünften niederländischer Kinder. Zwei Messzeitpunkte zeigen eine zeitliche Reihenfolge, beweisen aber keine Ursache. Gemessen wurde Fernsehwerbung; ob das Ergebnis für Werbung in sozialen Medien gilt, ist offen.",
  src:"Opree, S. J., Buijzen, M., & Valkenburg, P. M. (2012). Lower life satisfaction related to materialism in children frequently exposed to advertising. Pediatrics, 130(3), e486–e491. Opree, S. J., Buijzen, M., van Reijmersdal, E. A., & Valkenburg, P. M. (2014). Children's advertising exposure, advertised product desire, and materialism: A longitudinal study. Communication Research, 41(5), 717–735.",
  u:"https://doi.org/10.1542/peds.2011-3148",
  ev:1, typ:"Beobachtung",
  tip:"Fühlst du dich schlecht und siehst zugleich viel Werbung, kann der Wunsch nach neuen Dingen wachsen. Gerade dann kann es sich lohnen, einen Wunsch erst zu parken.",
  myth:false },

{ id:"i37", cat:"ko",
  t:"Statusgüter: Wo wir uns vergleichen und wo nicht",
  x:"Sara Solnick und David Hemenway stellten Studierenden und Beschäftigten der Harvard School of Public Health hypothetische Fragen. Möchtest du lieber 50.000 Dollar im Jahr verdienen, während alle anderen 25.000 haben, oder 100.000, während die anderen 200.000 haben? Etwa die Hälfte wählte die erste Welt: weniger Geld, aber mehr als die anderen. Beim eigenen Aussehen und beim Lob von Vorgesetzten war der Vergleich besonders wichtig. Beim Urlaub wählte nur etwa jede fünfte Person die Vergleichsvariante.",
  c:"Die Fragen waren hypothetisch, und alle Befragten kamen aus einem besonderen Umfeld. Forschende aus Göteborg befragten später Studierende in Costa Rica. Sie fanden beim Einkommen ein ähnliches Muster, beim Urlaub aber auch deutliche Vergleiche. Wofür wir uns vergleichen, hängt also wohl auch von Kultur und Fragestellung ab.",
  src:"Solnick, S. J., & Hemenway, D. (1998). Is more always better? A survey on positional concerns. Journal of Economic Behavior & Organization, 37(3), 373–383. Alpizar, F., Carlsson, F., & Johansson-Stenman, O. (2005). How much do we care about absolute versus relative income and consumption? Journal of Economic Behavior & Organization, 56(3), 405–421.",
  u:"https://doi.org/10.1016/S0167-2681(98)00089-4",
  links:[{n:"Alpizar, Carlsson & Johansson-Stenman 2005",u:"https://ideas.repec.org/a/eee/jeborg/v56y2005i3p405-421.html"}],
  ev:1, typ:"Beobachtung",
  tip:"Bei Dingen, die andere sehen, spielt der Vergleich oft mit. Freie Zeit scheint eher um ihrer selbst willen zu zählen. Das kann helfen, einen Wunsch einzuordnen.",
  myth:false },

{ id:"i38", cat:"ko",
  t:"Macht mehr Geld glücklicher? Ein Streit wird beigelegt",
  x:"2010 berichteten Daniel Kahneman und Angus Deaton, das Wohlbefinden steige ab etwa 75.000 Dollar Jahreseinkommen kaum noch. Matthew Killingsworth fand später keinen solchen Punkt. 2023 werteten Kahneman und Killingsworth gemeinsam mit Barbara Mellers Daten von 33.391 Berufstätigen in den USA neu aus. Ergebnis: Im Schnitt steigt das Wohlbefinden mit dem Einkommen weiter, aber pro Dollar immer langsamer. Nur bei den unglücklichsten 15 bis 20 Prozent flacht es oberhalb von etwa 100.000 Dollar ab.",
  c:"Der Zusammenhang ist klein: Zwischen 15.000 und 250.000 Dollar Einkommen liegt das mittlere Wohlbefinden nur etwa fünf Punkte auf einer Skala bis 100 auseinander. Die Daten stammen nur aus den USA und von Berufstätigen. Offen bleibt auch, was Ursache und was Folge ist.",
  src:"Killingsworth, M. A., Kahneman, D., & Mellers, B. (2023). Income and emotional well-being: A conflict resolved. Proceedings of the National Academy of Sciences, 120(10), e2208661120.",
  u:"https://doi.org/10.1073/pnas.2208661120",
  ev:2, typ:"Beobachtung",
  tip:"Mehr Einkommen geht im Schnitt mit etwas mehr Wohlbefinden einher, doch der Unterschied ist klein. Wer sehr unglücklich ist, findet die Lösung offenbar selten im Geld allein.",
  s:"Die Studie betrifft berufstätige Erwachsene. Für dich kann sie heißen: Mehr Geld hängt nur wenig mit besserer Stimmung zusammen. Ob das auch für Taschengeld gilt, wurde nicht untersucht.",
  myth:false },

{ id:"i39", cat:"wo",
  t:"IKEA-Effekt: Selbstgebautes schätzen wir mehr",
  x:"In einem Versuch bauten 52 Teilnehmende entweder selbst eine einfache Aufbewahrungsbox von IKEA zusammen oder bekamen eine fertige. Wer selbst gebaut hatte, bot dafür im Schnitt 78 Cent, die anderen nur 48 Cent. Bei Origami-Figuren boten Bastler für ihre eigenen Werke fast so viel wie andere für Figuren von Fachleuten. Fremde boten für dieselben Bastelwerke nur 5 Cent. Durfte man die Box nicht fertig bauen, schrumpfte der Vorteil deutlich.",
  c:"Die Versuche waren klein und arbeiteten mit Cent-Beträgen. Eine andere Forschungsgruppe fand den Effekt auch bei Kindern ab etwa fünf Jahren. Er zeigt eine Vorliebe für Eigenes, nicht, dass Selbstgebautes besser ist.",
  src:"Norton, M. I., Mochon, D., & Ariely, D. (2012). The IKEA effect: When labor leads to love. Journal of Consumer Psychology, 22(3), 453–460. Marsh, L. E., Kanngiesser, P., & Hood, B. (2018). When and how does labour lead to love? The ontogeny and mechanisms of the IKEA effect. Cognition, 170.",
  u:"https://doi.org/10.1016/j.jcps.2011.08.002",
  ev:2, typ:"Experiment",
  tip:"Was du selbst gebaut oder repariert hast, behältst du vermutlich lieber. Beim Aussortieren hilft es, diese Vorliebe zu kennen und trotzdem ehrlich zu fragen, ob du es nutzt.",
  myth:false },

{ id:"i40", cat:"er",
  t:"Erlebnisse schenken verbindet stärker",
  x:"Cindy Chan und Cassie Mogilner gaben Studierenden 10 Dollar, um einem Freund oder einer Freundin etwas zu schenken: entweder ein Ding oder ein Erlebnis. Wer ein Erlebnis bekam, fühlte sich danach mit der schenkenden Person stärker verbunden, auch wenn beide es nicht zusammen erlebten. Gefallen haben beide Geschenkarten ähnlich gut. Den Grund sehen die Autorinnen in den stärkeren Gefühlen beim Erleben selbst. In einer Umfrage war das zuletzt verschenkte Geschenk trotzdem bei rund 85 Prozent ein Ding.",
  c:"Die Arbeit umfasst mehrere Experimente, stammt aber von einem einzigen Team; unabhängige Wiederholungen sind kaum bekannt. Die Geschenke waren meist günstig. Ob der Vorteil auch bei teuren Geschenken gilt, ist offen.",
  src:"Chan, C., & Mogilner, C. (2017). Experiential gifts foster stronger social relationships than material gifts. Journal of Consumer Research, 43(6), 913–931.",
  u:"https://doi.org/10.1093/jcr/ucw067",
  ev:1, typ:"Experiment",
  tip:"Ein gemeinsamer Ausflug oder eine Konzertkarte kann eine Beziehung mehr stärken als ein weiteres Ding. Außerdem braucht ein Erlebnis keinen Platz im Regal.",
  s:"Ein Erlebnis muss nicht teuer sein. Ein Picknick oder ein gemeinsamer Filmabend kann ebenfalls funktionieren, auch wenn genau das nicht untersucht wurde.",
  myth:false },

{ id:"i41", cat:"ko",
  t:"Moralische Lizenz: Nach dem Guten das Nachlassen?",
  x:"Moralische Lizenz heißt: Wer gerade etwas Gutes getan hat, erlaubt sich danach eher etwas weniger Gutes. So die Idee: Jemand bringt Kleidung zur Spende und gönnt sich danach ohne schlechtes Gewissen einen Fehlkauf. Eine Metaanalyse von 2015 über 91 Studien mit 7.397 Teilnehmenden fand einen kleinen bis mittleren Effekt (d = 0,31). Veröffentlichte Studien zeigten dabei größere Effekte als unveröffentlichte.",
  c:"Eine Nachprüfung von 2019 rechnete fehlende, unveröffentlichte Studien heraus. Je nach Verfahren schrumpfte der Effekt auf d = 0,18 oder verschwand ganz. Große Wiederholungen fanden keinen oder einen deutlich kleineren Effekt. Moralische Lizenz gibt es vielleicht, aber schwächer als lange gedacht.",
  src:"Blanken, I., van de Ven, N., & Zeelenberg, M. (2015). A meta-analytic review of moral licensing. Personality and Social Psychology Bulletin, 41(4), 540–558. Kuper, N., & Bott, A. (2019). Has the evidence for moral licensing been inflated by publication bias? Meta-Psychology, 3.",
  u:"https://doi.org/10.1177/0146167215572134",
  links:[{n:"Kuper & Bott 2019",u:"https://doi.org/10.15626/MP.2018.878"}],
  ev:1, typ:"Übersicht",
  tip:"Merkst du nach einer guten Tat den Wunsch, dich zu „belohnen“, lohnt ein kurzer Blick darauf. Ein festes Gesetz des Verhaltens ist das nach heutigem Stand aber nicht.",
  myth:false },

{ id:"i42", cat:"kl",
  t:"Kapselgarderobe gegen Entscheidungsmüdigkeit? Die Grundlage wackelt",
  x:"Eine Kapselgarderobe ist eine kleine Auswahl an Kleidung, die gut zusammenpasst. Oft wird sie damit begründet, dass jede Entscheidung Willenskraft verbraucht. Diese Idee heißt Ego-Depletion, auf Deutsch etwa Erschöpfung der Selbstkontrolle. In einer großen Wiederholung mit 23 Laboren und 2.141 Teilnehmenden fand sich praktisch kein Effekt (d = 0,04). Eine zweite mit 36 Laboren und 3.531 Teilnehmenden kam auf d = 0,06, ebenfalls statistisch nicht gesichert.",
  c:"Beide Studien wurden vorab registriert, also mit festgelegtem Plan durchgeführt. Das macht sie besonders verlässlich. Einige Forschende halten andere Versuchsaufbauten für geeigneter. Doch die Idee eines Willenskraft-Akkus, der sich leert, gilt heute als schwach belegt. Andere Gründe für weniger Kleidung berührt das nicht.",
  src:"Hagger, M. S., Chatzisarantis, N. L. D., Alberts, H., et al. (2016). A multilab preregistered replication of the ego-depletion effect. Perspectives on Psychological Science, 11(4), 546–573. Vohs, K. D., Schmeichel, B. J., Lohmann, S., et al. (2021). A multisite preregistered paradigmatic test of the ego-depletion effect. Psychological Science, 32(10), 1566–1581.",
  u:"https://doi.org/10.1177/1745691616652873",
  links:[{n:"Vohs und Kollegen 2021",u:"https://doi.org/10.1177/0956797621989733"}],
  ev:3, evn:"Gut belegt: kein Effekt", typ:"Experiment",
  tip:"Eine kleine Garderobe kann trotzdem praktisch sein, weil sie Platz, Zeit und Geld spart. Als Schutz vor „verbrauchter Willenskraft“ taugt sie nach heutigem Stand eher nicht.",
  myth:false },

{ id:"i43", cat:"ko",
  t:"Gespartes Geld wird oft woanders ausgegeben",
  x:"Wer weniger kauft oder Energie spart, hat Geld übrig. Druckman und Kollegen berechneten 2011 für Haushalte in Großbritannien, was mit diesem Geld passiert. Sie betrachteten drei Sparschritte: die Heizung um ein Grad senken, kein Essen mehr wegwerfen und kurze Autofahrten zu Fuß oder mit dem Rad erledigen. Wird das gesparte Geld wie üblich ausgegeben, geht rund ein Drittel der CO2-Einsparung wieder verloren. Fachleute nennen das Rebound-Effekt.",
  c:"Das ist eine Modellrechnung mit britischen Durchschnittsdaten, keine Messung im echten Leben. Fließt das Geld in klimafreundliche Dinge, sinkt der Verlust auf etwa 12 Prozent. Fließt es in Ausgaben mit hohem CO2-Ausstoß, kann am Ende sogar mehr CO2 entstehen als vorher.",
  src:"Druckman, A., Chitnis, M., Sorrell, S., & Jackson, T. (2011). Missing carbon reductions? Exploring rebound and backfire effects in UK households. Energy Policy, 39(6), 3572–3581.",
  u:"https://doi.org/10.1016/j.enpol.2011.03.058",
  ev:1, typ:"Übersicht",
  tip:"Das kann heißen: Weniger kaufen wirkt am meisten, wenn das gesparte Geld nicht gleich in etwas Klimaschädliches fließt. Wofür es stattdessen gehen soll, kannst du bewusst entscheiden.",
  s:"Das kann heißen: Wenn du Taschengeld sparst, weil du weniger kaufst, lohnt die Frage, wofür du es stattdessen nutzt. Sparen für später ist dabei auch eine Möglichkeit.",
  myth:false },

{ id:"i44", cat:"ko",
  t:"Wenn Recyceln das Verschwenden leichter macht",
  x:"Catlin und Wang ließen Studierende mit Schere und Papier eine Aufgabe lösen. Stand nur ein Mülleimer bereit, verbrauchten sie im Mittel etwa 9 Gramm Papier. Stand zusätzlich ein Recyclingbehälter da, waren es etwa 17 Gramm. In einer Herrentoilette stieg der Verbrauch an Papierhandtüchern pro Person um etwa 17 Prozent, nachdem ein Recyclingbehälter aufgestellt worden war. Die Autoren vermuten: Die Möglichkeit zu recyceln nimmt dem Verschwenden das schlechte Gewissen.",
  c:"Die Studien waren klein, im Labor machten 44 Studierende mit. Ein anderes Team (Sun und Trudel, 2017) fand in eigenen kleinen Versuchen ein ähnliches Muster. Eine große, vorab registrierte Wiederholung ist uns nicht bekannt. Der Befund ist deshalb vorläufig.",
  src:"Catlin, J. R., & Wang, Y. (2013). Recycling gone bad: When the option to recycle increases resource consumption. Journal of Consumer Psychology, 23(1), 122–127. Sun, M., & Trudel, R. (2017). The effect of recycling versus trashing on consumption: Theory and experimental evidence. Journal of Marketing Research.",
  u:"https://doi.org/10.1016/j.jcps.2012.04.001",
  links:[{n:"Sun & Trudel 2017 (Manuskript)",u:"https://people.bu.edu/monic/recycling.pdf"}],
  ev:1, typ:"Experiment",
  tip:"Recyceln ist gut, aber weniger verbrauchen kommt davor. Wenn du merkst, dass du großzügiger wirst, weil es ja in die Wertstofftonne geht, lohnt ein kurzer Blick darauf.",
  myth:false },

{ id:"i45", cat:"wo",
  t:"Dinge, mit denen du etwas tust, machen ähnlich froh wie Erlebnisse",
  x:"Guevarra und Howell befragten Menschen in mehreren Studien nach einem Kauf und danach, wie froh er sie gemacht hatte. Sie unterschieden drei Arten: reine Dinge wie Schmuck oder Kleidung, Erlebnisse wie ein Konzert oder eine Reise und Dinge, um etwas zu tun, etwa ein Instrument, Sportsachen oder ein Videospiel. Die dritte Art machte ähnlich froh wie Erlebnisse und froher als reine Dinge. Die Autoren erklären das vor allem mit dem Gefühl, etwas zu können.",
  c:"Die Befunde beruhen auf Selbstauskunft, oft über erinnerte Käufe. Die Studien stammen aus einem Team, eine unabhängige Wiederholung ist uns nicht bekannt. Trotzdem ist das der direkteste Beleg in dieser App dafür, dass Besitz, der dich etwas tun lässt, wertvoll sein kann.",
  src:"Guevarra, D. A., & Howell, R. T. (2015). To have in order to do: Exploring the effects of consuming experiential products on well-being. Journal of Consumer Psychology, 25(1), 28–41.",
  u:"https://doi.org/10.1016/j.jcps.2014.06.006",
  ev:1, typ:"Beobachtung",
  tip:"Das kann heißen: Ein Ding, mit dem du wirklich etwas tust oder lernst, verdient einen Ehrenplatz. Entscheidend ist vermutlich die Nutzung, nicht der Besitz allein.",
  s:"Das kann heißen: Dein Ball, deine Gitarre oder dein Zeichenblock zählen vielleicht mehr als vieles andere. Hauptsache, du benutzt sie auch.",
  myth:false },

{ id:"i46", cat:"er",
  t:"Geschenke weitergeben kränkt weniger, als du denkst",
  x:"Adams, Flynn und Norton untersuchten 2012 in mehreren Studien, wie Menschen das Weiterverschenken sehen. Die Teilnehmenden stellten sich vor, ein Geschenk zu machen oder zu bekommen, etwa einen Gutschein oder eine Uhr. Beschenkte hielten Weitergeben fast für so kränkend wie Wegwerfen. Die Schenkenden selbst sahen das anders: Weitergeben fanden sie deutlich weniger schlimm als Wegwerfen. Sie meinten auch, ein Geschenk gehöre nach der Übergabe ganz den Beschenkten.",
  c:"Die meisten Situationen waren gedacht oder nachgestellt, nicht echt. Alle Studien stammen aus einem Team, die Teilnehmenden kamen aus den USA. Wie es in deiner Familie gesehen wird, kann anders sein. Eine unabhängige Wiederholung ist uns nicht bekannt.",
  src:"Adams, G. S., Flynn, F. J., & Norton, M. I. (2012). The gifts we keep on giving: Documenting and destigmatizing the regifting taboo. Psychological Science, 23(10), 1145–1150.",
  u:"https://doi.org/10.1177/0956797612439718",
  ev:1, typ:"Experiment",
  tip:"Das kann heißen: Ein Geschenk, das bei dir nur liegt, an jemanden weiterzugeben, der es nutzt, kränkt vermutlich weniger, als du fürchtest. Behalten darfst du es trotzdem.",
  s:"Das kann heißen: Weitergeben ist oft weniger schlimm, als du denkst. Bei Geschenken aus der Familie sprichst du aber vorher mit deinen Eltern.",
  myth:false },

{ id:"i47", cat:"ko",
  t:"Kann Minimalismus ein Statussymbol sein?",
  x:"Wilson und Bellezza entwickelten einen Fragebogen, der Minimalismus misst: wenige Dinge, eine schlichte Einrichtung und bewusstes Auswählen. In mehreren Studien mit zusammen 3.735 Teilnehmenden hing Minimalismus leicht damit zusammen, wie wohlhabend jemand aufgewachsen war. Die Autorinnen vermuten, dass Minimalismus manchmal als Zeichen von Status wirkt. Wer wenig besitzt, weil er es so will, zeigt, dass er die Wahl hat. Wer aus Not wenig hat, sendet dieses Zeichen nicht.",
  c:"Dass Minimalismus Status zeigt, haben die Autorinnen nicht geprüft, sie schlagen es als Frage für weitere Forschung vor. Der gemessene Zusammenhang mit dem Wohlstand war klein. Die Studien stammen vor allem aus den USA.",
  src:"Wilson, A. V., & Bellezza, S. (2022). Consumer minimalism. Journal of Consumer Research, 48(5), 796–816.",
  u:"https://doi.org/10.1093/jcr/ucab038",
  ev:0, typ:"Idee",
  tip:"Das kann heißen: Weniger zu besitzen ist kein Wettbewerb. Wenn schlichte, teure Dinge vor allem zeigen sollen, wer man ist, wird auch Minimalismus zum Vergleichen.",
  myth:false },

{ id:"i48", cat:"wo",
  t:"Faustregel: Wann sich Besitz lohnt",
  x:"Diese Karte ist eine Faustregel, kein Forschungsergebnis. Sie fasst zusammen, was andere Impulse nahelegen. Besitz lohnt sich eher, wenn du ein Ding oft benutzt. Er lohnt sich, wenn Leihen umständlich oder teuer wäre. Er lohnt sich, wenn ein Ding dich etwas können lässt oder Beziehungen trägt, etwa ein Erbstück oder ein Spiel für gemeinsame Abende. Und er lohnt sich eher, wenn ein Ding lange hält und sich reparieren lässt.",
  c:"Die Punkte stützen sich sinngemäß auf Befunde zu Dingen, mit denen man etwas tut, auf die Selbstbestimmungstheorie, die Nostalgieforschung, die Debatte ums Leihen und Rechnungen zur Herstellung von Geräten. Als Ganzes wurde die Regel nie geprüft.",
  src:"Eigene Zusammenfassung von Lichtung, gestützt auf: Guevarra, D. A., & Howell, R. T. (2015), Journal of Consumer Psychology, 25(1), 28–41; Chen, B., et al. (2015), Motivation and Emotion, 39(2), 216–236; Wildschut, T., et al. (2006), Journal of Personality and Social Psychology, 91(5), 975–993; Slee, T. (2015), The case of the power drill; Europäische Umweltagentur (2020), Briefing Nr. 02/2020.",
  links:[{n:"Chen und Kollegen 2015",u:"https://doi.org/10.1007/s11031-014-9450-1"},{n:"Wildschut und Kollegen 2006",u:"https://doi.org/10.1037/0022-3514.91.5.975"},{n:"Slee 2015",u:"https://tomslee.net/posts/2015-09-16-the-case-of-the-power-drill/index.html"},{n:"Europäische Umweltagentur 2020",u:"https://www.eea.europa.eu/en/analysis/publications/europes-consumption-in-a-circular-economy-the-benefits-of-longer-lasting-electronics"}],
  ev:0, typ:"Idee",
  tip:"Das kann heißen: Vor einem Kauf oder beim Aussortieren kannst du die vier Punkte kurz durchgehen. Sie ersetzen nicht dein eigenes Urteil, sie ordnen es nur.",
  myth:false },

{ id:"i49", cat:"wo",
  t:"Vorsorge: ein Vorrat, der sinnvoll ist",
  x:"Nicht jeder Besitz ist überflüssig. Das Bundesamt für Bevölkerungsschutz und Katastrophenhilfe (BBK) rät, sich in einer Notlage möglichst zehn Tage lang selbst mit Essen und Trinken versorgen zu können. Schon ein Vorrat für drei Tage hilft nach Angaben des Amtes. Zum Trinken braucht ein Erwachsener mindestens 1,5 Liter am Tag, zum Kochen kommen etwa 0,5 Liter dazu. Ein Vorrat aus Dingen, die man ohnehin isst, lässt sich nach und nach verbrauchen und erneuern.",
  c:"Das ist die Empfehlung einer Behörde, keine Studie. Die zehn Tage sind ein Richtwert. Sie sagen nichts darüber, wie wahrscheinlich eine Notlage ist. Wie viel du brauchst, hängt von Haushalt, Gesundheit und Wohnort ab.",
  src:"Bundesamt für Bevölkerungsschutz und Katastrophenhilfe (BBK). Essen und Trinken bevorraten. Online-Ratgeber, abgerufen im Oktober 2026. Dazu: BBK. Vorsorgen für Krisen und Katastrophen (Ratgeber mit Checkliste).",
  u:"https://www.bbk.bund.de/DE/Warnung-Vorsorge/Vorsorge/So-koennen-Sie-sich-vorbereiten/Bevorraten/bevorraten_node.html",
  links:[{n:"BBK-Ratgeber mit Checkliste",u:"https://www.bbk.bund.de/DE/Warnung-Vorsorge/Vorsorge/Ratgeber-Checkliste/ratgeber-checkliste_node.html"}],
  ev:0, evn:"Empfehlung einer Behörde", typ:"Empfehlung",
  tip:"Ein Vorrat ist Besitz mit klarem Zweck. Wenn du aussortierst, kann es sinnvoll sein, Platz für ihn zu lassen, statt jeden Schrank zu leeren.",
  s:"Ob und wo es zu Hause einen Vorrat gibt, entscheiden deine Eltern. Du kannst anbieten, beim Planen oder beim Prüfen der Haltbarkeit zu helfen.",
  myth:false }
];

  imp:"i42" },

{ id:"u02", cat:"kl", t:"Bügel umdrehen", d:30,
  x:"Häng alle Kleiderbügel verkehrt herum in den Schrank. Sobald du ein Teil getragen und zurückgehängt hast, drehst du seinen Bügel richtig herum. Nach 30 Tagen siehst du auf einen Blick, was du gar nicht angezogen hast.",
  steps:["Dreh heute alle Bügel so, dass der Haken zu dir zeigt.","Häng getragene Teile mit richtig gedrehtem Bügel zurück.","Mach für Gefaltetes eine kleine Strichliste an der Schranktür.","Schau dir nach 30 Tagen die verkehrt hängenden Teile an.","Frag dich bei jedem, ob es nur zur Jahreszeit nicht passt oder ob du es nicht mehr magst."],
  wenn:"Wenn nach 30 Tagen ein Teil verkehrt hängt und gerade Saison hat, dann lege ich es in die Vielleicht-Kiste statt in den Müll.",
  warum:"Viele Menschen besitzen Kleidung, die sie kaum oder nie tragen, und dieser Test zeigt dir, ob das bei dir auch so ist.",
  imp:"i26" },

{ id:"u03", cat:"kl", t:"Ein Teil wieder tragbar machen", d:5,
  x:"Such ein Kleidungsstück heraus, das du nur wegen eines kleinen Schadens nicht trägst. Ein loser Knopf, eine offene Naht oder ein Loch reicht. Lerne in den nächsten Tagen, es selbst zu flicken, oder bring es zu einer Schneiderei.",
  steps:["Such ein Teil mit einem kleinen Schaden heraus.","Schau dir eine Anleitung an oder frag jemanden, der nähen kann.","Besorg Nadel und passendes Garn oder leih dir beides.","Flick das Teil oder gib es zur Reparatur.","Trag es in der Woche danach mindestens einmal."],
  wenn:"Wenn ich beim Anziehen einen losen Knopf bemerke, dann lege ich das Teil sofort in eine kleine Flickschale und nicht zurück in den Schrank.",
  warum:"Nach der Selbstbestimmungstheorie tut es gut, sich fähig und selbstständig zu fühlen, und etwas selbst zu reparieren, kann dieses Gefühl stärken.",
  imp:"i17",
  s:"Such ein eigenes Kleidungsstück heraus, das du nur wegen eines kleinen Schadens nicht trägst. Frag zu Hause, ob dir jemand zeigt, wie man einen Knopf annäht oder eine Naht schließt. Nadel und Garn gibt es oft schon im Haushalt." },

{ id:"u04", cat:"kl", t:"Kleidertausch mit Freunden", d:14,
  x:"Verabrede dich in den nächsten zwei Wochen mit ein paar Menschen zu einem kleinen Kleidertausch. Jeder bringt gut erhaltene Teile mit, die er nicht mehr trägt. Was am Ende übrig bleibt, geht gemeinsam zu einer Kleiderkammer.",
  steps:["Frag drei bis fünf Menschen, ob sie mitmachen.","Leg einen Termin und einen Ort fest.","Such pro Person höchstens zehn saubere, heile Teile heraus.","Nimm beim Tausch nur Teile mit, die du dir sofort anziehen würdest.","Bring die übrigen Teile gemeinsam zu einer Kleiderkammer."],
  wenn:"Wenn ich beim Tausch ein Teil nur nehme, weil es umsonst ist, dann lege ich es zurück auf den Tisch.",
  warum:"Kleidung wird heute im Schnitt kürzer getragen als früher, und ein Tausch verlängert ihre Nutzung, ohne dass etwas Neues hergestellt wird.",
  imp:"i27",
  s:"Verabrede dich mit Freundinnen oder Freunden zu einem kleinen Kleidertausch. Bring nur eigene Kleidung mit und frag vorher deine Eltern, ob du sie weitergeben darfst. Was übrig bleibt, geht gemeinsam zu einer Kleiderkammer." },

{ id:"u05", cat:"kl", t:"Drei Wochen nichts Neues zum Anziehen", d:21,
  x:"Kauf drei Wochen lang keine neue Kleidung, auch keine Schnäppchen. Wenn wirklich etwas fehlt, leihst du es, kaufst es gebraucht oder parkst den Wunsch. Socken und Unterwäsche, die kaputt sind, darfst du ersetzen.",
  steps:["Schreib dir das Startdatum in den Kalender.","Park jeden Kleidungswunsch in der App, statt ihn sofort zu kaufen.","Kombinier ein Teil, das du lange nicht getragen hast, neu.","Schau nach drei Wochen, welche Wünsche noch da sind."],
  wenn:"Wenn ich online auf ein Kleidungsangebot klicke, dann lege ich es nicht in den Warenkorb, sondern parke es als Wunsch.",
  warum:"Nach einer britischen Modellrechnung wiegt die Herstellung von Kleidung schwer, darum bringt längeres Tragen am meisten, wenn dadurch ein Neukauf wegfällt.",
  imp:"i28",
  s:"Kauf dir drei Wochen lang keine neue Kleidung von deinem Geld und bitte auch niemanden darum. Wenn etwas wirklich fehlt, zum Beispiel weil Schuhe zu klein sind, sprich mit deinen Eltern. Andere Kleidungswünsche parkst du in der App." },

// ---------- Wohnen ----------
{ id:"u06", cat:"wo", t:"Eine Schublade am Tag", d:7,
  x:"Nimm dir eine Woche lang jeden Tag genau eine Schublade oder ein Fach vor. Du räumst alles aus, wischst kurz durch und legst nur zurück, was hineingehört und was du benutzt. Der Rest bekommt einen anderen Platz oder geht weiter.",
  steps:["Such dir sieben Schubladen oder Fächer aus.","Räum jeden Tag eine davon ganz aus.","Leg zurück, was du benutzt und was dorthin gehört.","Gib Doppeltes und Brauchbares in eine Weitergeben-Tüte.","Hör nach einer Schublade auf, auch wenn du Lust auf mehr hast."],
  wenn:"Wenn ich abends den Wasserkocher anschalte, dann räume ich in der Wartezeit die Schublade des Tages aus.",
  warum:"In einer kleinen Studie hatten Frauen, die ihr Zuhause als unordentlich beschrieben, einen ungünstigeren Tagesverlauf des Stresshormons Cortisol, und ob Aufräumen dir Ruhe bringt, kannst du nur an dir beobachten.",
  imp:"i08",
  s:"Nimm dir eine Woche lang jeden Tag eine eigene Schublade oder ein Fach in deinem Zimmer vor. Räum es aus und leg nur zurück, was du benutzt. Gemeinsame Schubladen der Familie räumst du nur nach Absprache auf." },

{ id:"u07", cat:"wo", t:"Reparieren vor Ersetzen", d:14,
  x:"Such ein kaputtes Ding im Haushalt heraus und finde in zwei Wochen heraus, ob man es reparieren kann. Ein Reparatur-Café, eine Anleitung oder ein Fachbetrieb können helfen. Geräte mit Netzstrom oder Lithium-Akku nur stromlos öffnen. Akkus und Netzteile reparieren Fachleute.",
  steps:["Wähl ein kaputtes Ding aus, das du eigentlich ersetzen wolltest.","Schreib genau auf, was nicht mehr geht.","Such nach einem Reparatur-Café in deiner Nähe oder nach einer Anleitung.","Probier die Reparatur oder lass sie machen.","Gib das Ding zum Recyclinghof, wenn es wirklich nicht zu retten ist."],
  wenn:"Wenn ich den Gedanken habe, etwas Kaputtes neu zu kaufen, dann suche ich zuerst zehn Minuten nach einer Reparaturmöglichkeit.",
  warum:"Bei Handys und Notebooks steckt ein großer Teil der Klimalast schon in der Herstellung, darum zählt dort jedes Jahr, das ein Gerät länger hält.",
  imp:"i29",
  s:"Such ein eigenes Ding heraus, das kaputt ist, zum Beispiel Kopfhörer, eine Lampe oder ein Fahrradteil. Finde heraus, ob man es reparieren kann. Bei Geräten mit Netzstecker oder Akku arbeitest du nur mit einer erwachsenen Person zusammen." },

{ id:"u08", cat:"wo", t:"Das teure Ding im Schrank", d:3,
  x:"Such ein Ding, das du kaum benutzt und nur behältst, weil es viel Geld gekostet hat. Frag dich drei Tage lang: Würde ich es heute für diesen Preis kaufen? Danach entscheidest du, ob du es benutzt, verkaufst, verleihst oder in die Vielleicht-Kiste legst.",
  steps:["Such ein teures Ding, das du selten benutzt.","Stell es drei Tage lang an einen Platz, an dem du es siehst.","Frag dich jeden Tag, ob du es heute noch einmal kaufen würdest.","Entscheide am dritten Tag, was damit passiert."],
  wenn:"Wenn ich denke „Es war doch so teuer“, dann frage ich mich, ob ich es heute noch einmal kaufen würde.",
  warum:"Geld, das schon ausgegeben ist, kommt nicht zurück, und trotzdem halten Menschen oft an Dingen fest, weil sie einmal viel gekostet haben.",
  imp:"i06",
  s:"Such ein eigenes Ding, das du kaum benutzt und nur behältst, weil es teuer war. Frag dich drei Tage lang, ob du es heute noch einmal haben wollen würdest. Wenn deine Eltern es bezahlt haben, besprich mit ihnen, was damit passiert." },

{ id:"u09", cat:"wo", t:"Was macht dich fähig?", d:7,
  x:"Geh eine Woche lang dein Werkzeug, deine Küchengeräte oder deine Hobbysachen durch. Probier jedes Teil kurz aus. Was dich fähig macht, behältst du mit Grund. Doppeltes und Ungenutztes verleihst oder verschenkst du an Menschen, die es brauchen.",
  steps:["Wähl einen Bereich aus, zum Beispiel Werkzeugkiste, Küche oder Bastelkiste.","Prüf an jedem Tag einen Teil davon.","Markier Dinge, die dich etwas selbst tun lassen.","Leg Doppeltes zur Seite und frag in deinem Umfeld, wer es braucht.","Trag das wichtigste Teil in der App als „macht mich fähig“ ein."],
  wenn:"Wenn ich zwei Dinge für denselben Zweck finde, dann behalte ich das bessere und frage, wer das andere brauchen kann.",
  warum:"Nach der Selbstbestimmungstheorie tut es gut, sich fähig und selbstständig zu fühlen, und Dinge, mit denen du etwas selbst kannst, tragen vielleicht dazu bei.",
  imp:"i17",
  s:"Geh eine Woche lang deine eigenen Hobbysachen, Bastelsachen oder Sportsachen durch. Probier jedes Teil kurz aus. Was dich etwas selbst tun lässt, behältst du mit Grund. Werkzeug der Familie bleibt, wo es ist." },

{ id:"u10", cat:"wo", t:"Eine freie Fläche", d:21,
  x:"Wähl eine Fläche aus, zum Beispiel den Esstisch, den Schreibtisch oder die Kommode im Flur. Drei Wochen lang räumst du sie jeden Abend leer. Achte darauf, wie es sich anfühlt, morgens auf eine freie Fläche zu schauen.",
  steps:["Such dir eine Fläche aus, auf der sich oft Dinge sammeln.","Räum sie heute ganz leer.","Gib jedem Ding, das dort lag, einen festen Platz.","Räum die Fläche jeden Abend in zwei Minuten frei.","Notiere einmal pro Woche, was sich dort immer wieder sammelt."],
  wenn:"Wenn ich abends das Licht im Zimmer ausschalte, dann räume ich vorher die Fläche frei.",
  warum:"In einer Laborstudie mit einfachen Formen konkurrierten mehrere Dinge im Blickfeld um die Verarbeitung im Gehirn, und ob dir eine freie Fläche hilft, probierst du hier aus.",
  imp:"i11",
  s:"Wähl eine eigene Fläche aus, zum Beispiel deinen Schreibtisch oder dein Nachttischchen. Drei Wochen lang räumst du sie jeden Abend frei. Achte darauf, wie es sich anfühlt, dort morgens oder bei den Hausaufgaben auf eine freie Fläche zu schauen." },

// ---------- Papier & Digitales ----------
{ id:"u11", cat:"pa", t:"Der Papierstapel auf null", d:7,
  x:"Sammle alle losen Papiere an einem Ort, also Briefe, Rechnungen, Zettel und Prospekte. Eine Woche lang bearbeitest du jeden Tag einen Teil. Am Ende liegt nichts mehr herum, und alles Wichtige steckt in einem Ordner.",
  steps:["Sammle heute alle losen Papiere in einer Kiste.","Leg einen einzigen Ordner für Wichtiges bereit.","Bearbeite jeden Tag eine Handvoll Papiere.","Erledige, was weniger als zwei Minuten dauert, sofort.","Bring Altpapier gleich zum Container."],
  wenn:"Wenn ich Post aus dem Briefkasten hole, dann öffne ich sie noch im Flur und lege sie in den Ordner oder ins Altpapier.",
  warum:"Eine Laborstudie deutet an, dass Ungeordnetes im Blickfeld um Aufmerksamkeit konkurriert, und ob dir ein Stapel auf null Ruhe bringt, merkst du nach dieser Woche.",
  imp:"i11",
  s:"Sammle alle deine losen Papiere an einem Ort, also Arbeitsblätter, Zettel aus der Schule und alte Notizen. Bearbeite eine Woche lang jeden Tag einen Teil. Am Ende steckt alles, was du noch brauchst, in einer Mappe. Elternbriefe gibst du sofort ab." },

{ id:"u12", cat:"pa", t:"Werbung abbestellen", d:3,
  x:"Bestell drei Tage lang jede Werbung ab, die bei dir ankommt. Das gilt für Newsletter im Postfach, Benachrichtigungen von Shop-Apps und Prospekte im Briefkasten. Ein Aufkleber gegen Werbung am Briefkasten hilft dabei.",
  steps:["Such im Postfach nach dem Wort „abbestellen“ und klick dich durch.","Schalte bei Shop-Apps die Benachrichtigungen aus.","Lösch Shop-Apps, die du nur aus Langeweile öffnest.","Kleb einen Hinweis gegen Werbung an deinen Briefkasten."],
  wenn:"Wenn eine Werbe-Mail ankommt, dann bestelle ich sie ab, bevor ich sie lese.",
  warum:"Bei Kindern ging mehr Fernsehwerbung mit stärkeren Produktwünschen und mehr Materialismus einher, und weniger Werbung nimmt Anlässe für neue Wünsche weg.",
  imp:"i36",
  s:"Bestell drei Tage lang jede Werbung ab, die auf deinem Handy und in deinem Postfach ankommt. Schalte bei Shop-Apps die Benachrichtigungen aus. Den Briefkasten der Familie fasst du nur an, wenn deine Eltern einverstanden sind." },

{ id:"u13", cat:"pa", t:"Ein Monat Fotos am Abend", d:14,
  x:"Geh zwei Wochen lang jeden Abend die Fotos eines Monats auf deinem Handy durch. Lösch Doppelte, unscharfe Bilder und Bildschirmfotos, die du nicht mehr brauchst. Markier pro Monat deine liebsten Bilder als Favoriten.",
  steps:["Sichere zuerst alle Fotos an einem zweiten Ort, etwa auf einem Computer oder einer Festplatte.","Fang mit dem ältesten Monat auf deinem Handy an.","Lösch Serien bis auf das beste Bild.","Lösch Bildschirmfotos, die erledigt sind.","Markier pro Monat höchstens zehn Lieblingsbilder."],
  wenn:"Wenn ich nach dem Abendessen den Tisch abgeräumt habe, dann sortiere ich einen Monat Fotos.",
  warum:"An schöne Zeiten zu denken, kann nach der Nostalgieforschung guttun, und das gelingt leichter, wenn die guten Bilder nicht zwischen Tausenden anderen verschwinden.",
  imp:"i33",
  s:"Geh zwei Wochen lang jeden Abend die Fotos eines Monats auf deinem Handy durch. Fotos liegen oft in einem Familienkonto oder werden mit anderen geteilt. Frag deshalb vorher, ob gelöschte Bilder auch bei anderen verschwinden, und sichere sie zuerst an einem zweiten Ort." },

{ id:"u14", cat:"pa", t:"Erst schauen, dann ein Foto", d:2,
  x:"Mach an zwei Tagen, an denen du etwas Besonderes erlebst, ein kleines Experiment. Du schaust zuerst eine Minute lang genau hin, bevor du das Handy herausholst. Danach machst du höchstens ein Foto pro Ort.",
  steps:["Such dir zwei Tage mit einem Ausflug oder einem Treffen aus.","Schau an jedem Ort zuerst eine Minute lang hin.","Mach danach höchstens ein Foto.","Schreib abends drei Dinge auf, an die du dich gut erinnerst."],
  wenn:"Wenn ich das Handy für ein Foto heraushole, dann stecke ich es noch einmal weg und schaue zuerst eine Minute hin.",
  warum:"In einer Studie erinnerten sich Menschen an Kunstwerke, die sie fotografiert hatten, schlechter als an solche, die sie nur angeschaut hatten.",
  imp:"i34" },

{ id:"u15", cat:"pa", t:"Das Handy im anderen Raum", d:7,
  x:"Leg dein Handy eine Woche lang jeden Tag für eine Stunde in einen anderen Raum. Nutze die Zeit zum Lernen, Lesen oder Arbeiten. Achte darauf, ob du dich anders konzentrieren kannst als sonst.",
  steps:["Wähl eine feste Stunde am Tag aus.","Stell das Handy auf lautlos und leg es in einen anderen Raum.","Mach in dieser Stunde eine Aufgabe, die Ruhe braucht.","Notiere danach in einem Satz, wie es dir ging."],
  wenn:"Wenn ich mich an den Schreibtisch setze, um etwas Wichtiges zu tun, dann bringe ich vorher das Handy in die Küche.",
  warum:"Ob schon die Nähe des Handys das Denken bremst, ist nach gescheiterten Wiederholungen unsicher, deshalb prüfst du es hier an dir selbst.",
  imp:"i35" },

// ---------- Erinnerungen ----------
{ id:"u16", cat:"er", t:"Foto und Geschichte", d:7,
  x:"Nimm eine Woche lang jeden Tag ein Erinnerungsstück in die Hand, das du nicht benutzt. Fotografiere es und schreib zwei, drei Sätze zu seiner Geschichte auf. Danach entscheidest du, ob es bleibt, weitergeht oder in die Vielleicht-Kiste kommt.",
  steps:["Stell eine Kiste mit Erinnerungsstücken bereit.","Fotografiere jeden Tag ein Stück bei gutem Licht.","Schreib auf, woher es kommt und woran es dich erinnert.","Entscheide ohne Eile, ob es bleibt oder weitergeht.","Frag bei Familienstücken, ob jemand anderes es haben möchte."],
  wenn:"Wenn ich ein Erinnerungsstück nicht weggeben mag, weil die Erinnerung daran hängt, dann fotografiere ich es und schreibe die Geschichte auf, bevor ich entscheide.",
  warum:"In Studien fiel es Menschen etwas leichter, ein Erinnerungsstück wegzugeben, wenn sie es vorher fotografiert hatten, weil sie dann weniger das Gefühl hatten, ein Stück von sich zu verlieren.",
  imp:"i07",
  s:"Nimm eine Woche lang jeden Tag ein eigenes Erinnerungsstück in die Hand, zum Beispiel ein altes Spielzeug oder eine Urkunde. Fotografiere es und schreib seine Geschichte auf. Bevor du etwas weggibst, frag deine Eltern, ob sie es behalten möchten." },

{ id:"u17", cat:"er", t:"Ein Erlebnis schenken", d:14,
  x:"Plan in den nächsten zwei Wochen das nächste Geschenk für einen Menschen als gemeinsames Erlebnis. Das kann ein Ausflug, ein gemeinsames Kochen oder ein Konzert sein. Schreib es auf eine Karte und verabrede einen festen Termin.",
  steps:["Denk an einen Menschen, der bald Geburtstag hat oder dem du etwas schenken willst.","Überleg, was ihr beide gern zusammen macht.","Schreib das Erlebnis auf eine selbst gestaltete Karte.","Mach beim Überreichen gleich einen Termin aus."],
  wenn:"Wenn ich im Laden ein Geschenk für jemanden suche, dann überlege ich zuerst, was wir zusammen erleben könnten.",
  warum:"In Studien fühlten sich Beschenkte nach einem Erlebnisgeschenk der schenkenden Person stärker verbunden als nach einem Sachgeschenk.",
  imp:"i40",
  s:"Plan das nächste Geschenk für einen Menschen als gemeinsames Erlebnis, das wenig oder nichts kostet. Das kann ein Spaziergang zu einem besonderen Ort, ein Spieleabend oder ein selbst gekochtes Essen sein. Schreib es auf eine Karte und mach einen Termin aus." },

{ id:"u18", cat:"er", t:"Ein Ehrenplatz", d:1,
  x:"Such heute ein Erinnerungsstück heraus, das dir wirklich etwas bedeutet und bisher in einer Kiste lag. Gib ihm einen Platz, an dem du es täglich siehst. Trag es in der App als „trägt Bedeutung“ ein.",
  steps:["Öffne eine Kiste oder Schublade mit Erinnerungsstücken.","Such das eine Stück aus, das dir am meisten bedeutet.","Stell es an einen Platz, an dem du es oft siehst.","Trag es in der App mit dem Grund „trägt Bedeutung“ ein."],
  wenn:"Wenn ich beim Aufräumen ein Stück finde, das mich sofort lächeln lässt, dann gebe ich ihm einen sichtbaren Platz, statt es zurück in die Kiste zu legen.",
  warum:"Nostalgie kann nach der Forschung Stimmung und Verbundenheit stärken, und ein sichtbares Erinnerungsstück gibt ihr vielleicht öfter einen Anlass.",
  imp:"i33" },

{ id:"u19", cat:"er", t:"Ein Geschenk, das nicht zu dir passt", d:7,
  x:"Such ein Geschenk heraus, das du nie benutzt und nur aus Pflichtgefühl behältst. Schreib eine Woche lang jeden Tag einen Satz dazu auf, was die schenkende Person dir zeigen wollte. Danach entscheidest du, ob es bleibt, weitergeht oder in die Vielleicht-Kiste kommt.",
  steps:["Such ein Geschenk heraus, das du nie benutzt.","Schreib auf, was die Person dir damit sagen wollte.","Trenn in Gedanken die Zuneigung von dem Ding.","Überleg, ob jemand das Ding wirklich gebrauchen könnte.","Entscheide in Ruhe, ob es bleibt, weitergeht oder in die Vielleicht-Kiste kommt."],
  wenn:"Wenn ich beim Gedanken ans Weitergeben ein schlechtes Gewissen bekomme, dann sage ich mir, dass die Zuneigung bleibt, egal wie ich mich entscheide.",
  warum:"In Studien sahen Schenkende das Weitergeben eines Geschenks deutlich gelassener, als die Beschenkten vermuteten.",
  imp:"i46",
  s:"Such ein eigenes Geschenk heraus, das du nie benutzt und nur aus Pflichtgefühl behältst. Schreib auf, was die Person dir damit zeigen wollte. Wenn es von jemandem aus der Familie ist, sprich mit deinen Eltern, bevor du es weitergibst." },

{ id:"u20", cat:"er", t:"Die besten Stücke einer Sammlung", d:21,
  x:"Wähl eine Sammlung aus, zum Beispiel Bücher, Karten, Steine oder Figuren. Such in drei Wochen die zehn Stücke heraus, die dir am meisten bedeuten, und stell sie gut sichtbar auf. Über die übrigen Stücke entscheidest du danach in Ruhe.",
  steps:["Wähl eine Sammlung aus, die du schon lange hast.","Leg in der ersten Woche alles einmal vor dich hin.","Such in der zweiten Woche die zehn besten Stücke heraus.","Stell sie in der dritten Woche gut sichtbar auf.","Entscheide, ob die übrigen Stücke bleiben, in die Vielleicht-Kiste kommen oder zu Menschen gehen, die sie schätzen."],
  wenn:"Wenn ich bei einem Stück außerhalb der besten zehn unsicher bin, dann frage ich mich, was ich dafür bezahlen würde, wenn es mir nicht gehören würde.",
  warum:"Was uns gehört, bewerten wir oft höher, als wir es von außen tun würden, und der Blick von außen hilft beim Auswählen.",
  imp:"i05" },

// ---------- Kaufen & Teilen ----------
{ id:"u21", cat:"ko", t:"Die 30-Tage-Wunschliste", d:30,
  x:"Kauf 30 Tage lang nichts, was nicht auf deinem Einkaufszettel stand. Jeder andere Wunsch kommt auf eine Liste mit Datum. Nach 30 Tagen schaust du, welche Wünsche noch da sind, und entscheidest dann in Ruhe.",
  steps:["Leg in der App oder auf Papier eine Wunschliste an.","Schreib jeden spontanen Kaufwunsch mit Datum darauf.","Schau dir die Liste einmal pro Woche an.","Streich Wünsche, die schon verblasst sind.","Entscheide nach 30 Tagen über jeden übrigen Wunsch."],
  wenn:"Wenn ich etwas sofort haben will, dann parke ich es als Wunsch und schaue es mir erst nach 30 Tagen wieder an.",
  warum:"Im aufgeregten Zustand schätzen wir schlecht ein, wie wir später in Ruhe darüber denken, und Warten gibt dem ruhigen Blick eine Chance.",
  imp:"i23",
  s:"Kauf 30 Tage lang nichts von deinem eigenen Geld, was du nicht schon vorher geplant hattest. Jeder andere Wunsch kommt mit Datum auf eine Liste. Nach 30 Tagen schaust du, was du noch willst, und entscheidest dann." },

{ id:"u22", cat:"ko", t:"Leihen statt kaufen", d:14,
  x:"Wenn du in den nächsten zwei Wochen etwas brauchst, das du selten benutzt, leihst du es. Frag Nachbarn, Freunde, eine Leihbücherei oder einen Leihladen. Achte darauf, wie das Leihen klappt und was es dich kostet.",
  steps:["Schreib auf, was du in nächster Zeit brauchen könntest.","Such heraus, wo man in deiner Nähe Dinge leihen kann.","Frag mindestens einmal jemanden direkt, ob er dir etwas leiht.","Gib das Geliehene sauber und pünktlich zurück.","Biete selbst etwas zum Leihen an."],
  wenn:"Wenn ich etwas kaufen will, das ich voraussichtlich nur ein paar Mal im Jahr brauche, dann frage ich zuerst in meiner Nachbarschaft, ob es jemand verleiht.",
  warum:"Die bekannte Zahl zur kaum benutzten Bohrmaschine ist schlecht belegt, darum findest du durch eigenes Ausprobieren heraus, ob Leihen für dich passt.",
  imp:"i30",
  s:"Wenn du in den nächsten zwei Wochen etwas brauchst, das du selten benutzt, leihst du es. Frag Freunde, Geschwister, die Stadtbücherei oder die Schule. Gib alles sauber und pünktlich zurück." },

{ id:"u23", cat:"ko", t:"Die Einkaufszettel-Regel", d:14,
  x:"Geh zwei Wochen lang nur mit einem Einkaufszettel einkaufen, im Laden und im Netz. Du kaufst nur, was darauf steht. Alles andere, was dir unterwegs gefällt, schreibst du auf und parkst es als Wunsch.",
  steps:["Schreib vor jedem Einkauf einen Zettel.","Nimm im Laden nur, was auf dem Zettel steht.","Notiere andere Dinge, die dir gefallen, auf der Rückseite.","Übertrag diese Dinge zu Hause in deine Wunschliste."],
  wenn:"Wenn ich im Laden etwas in die Hand nehme, das nicht auf dem Zettel steht, dann lege ich es zurück und schreibe es auf die Rückseite.",
  warum:"Viele Studien zeigen, dass ein vorher festgelegter Wenn-dann-Plan hilft, Vorsätze in Situationen umzusetzen, in denen man sonst aus Gewohnheit handelt.",
  imp:"i24",
