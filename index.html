const IMPULSE=[...IMPULSE_A,...IMPULSE_B];const QUIZ=[...QUIZ_A,...QUIZ_B];

/* ===== Klickdesign und Vibration ===== */
const IOS=/iP(hone|ad|od)/.test(navigator.userAgent)||(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1);
const RM=()=>matchMedia("(prefers-reduced-motion: reduce)").matches;
/* Familien: Aktion, Auswahl, Schalter, Logo. Navigation tickt nicht. */
const FAM_ACT=".btn,.tile,.card[data-a],.act";
const FAM_SEL=".chip,.opt,.scale>button,.ans";
const FAM_TOG=".switch";
const FAM_LOGO="#logo";
const HAPSEL=[FAM_ACT,FAM_SEL,FAM_TOG,FAM_LOGO].join(",");
const TAPSEL=HAPSEL+",.tab,.row,.lnk,summary,.chipx,.tree-hit";
const VIB={sel:10,act:12,tog:10,logo:12,ok:[10,60,14],err:[24,60,24]};
let tapKind=null;
function vibOn(){ return !S||!S.settings||S.settings.vib!==false }
function famOf(el){
  if(!el) return null;
  if(el.matches(FAM_LOGO)) return "logo";
  if(el.matches(FAM_TOG)) return "tog";
  if(el.matches(FAM_SEL)) return "sel";
  if(el.matches(FAM_ACT)) return "act";
  return null;
}
/* Handler setzen buzz("ok"|"err"), dann gibt es genau diese eine Rückmeldung statt der Familie */
function buzz(k){ tapKind=k }
function vibrateNow(k){ if(!vibOn()||IOS||!navigator.vibrate) return; try{ navigator.vibrate(VIB[k]||12) }catch(e){} }

/* iPhone: ein Finger legt einen unsichtbaren Schalter um, das gibt den System-Tick.
   Ein label liegt über der Fläche und lässt Scrollen frei. */
function armHaptics(){
  if(!IOS||!vibOn()) return;
  document.querySelectorAll(HAPSEL).forEach(el=>{
    if(el.tagName==="A"||el.tagName==="LABEL"||el.querySelector(":scope>label.hap")) return;
    if(getComputedStyle(el).position==="static") el.style.position="relative";
    const l=document.createElement("label"); l.className="hap"; l.setAttribute("aria-hidden","true");
    l.addEventListener("click",e=>{ if(e.target===l) e.stopPropagation() });
    const i=document.createElement("input"); i.type="checkbox"; i.setAttribute("switch",""); i.tabIndex=-1;
    l.appendChild(i); el.appendChild(l);
  });
}
function disarmHaptics(){ document.querySelectorAll("label.hap").forEach(l=>l.remove()) }
let hq=false;
if(IOS) new MutationObserver(()=>{ if(!hq){ hq=true; requestAnimationFrame(()=>{ hq=false; armHaptics() }) } })
  .observe(document.documentElement,{childList:true,subtree:true});

/* Wischen bricht das Tippen ab; Loslassen nach dem Scrollen löst nichts aus */
let tg=null, cancelUntil=0;
addEventListener("touchstart",e=>{ cancelUntil=0; const t=e.touches[0], el=e.target.closest&&e.target.closest(TAPSEL);
  tg=el?{el,x:t.clientX,y:t.clientY,moved:false}:null; if(el) el.classList.remove("nopress") },{passive:true,capture:true});
addEventListener("touchmove",e=>{ if(!tg||tg.moved) return; const t=e.touches[0];
  if(Math.hypot(t.clientX-tg.x,t.clientY-tg.y)>10){ tg.moved=true; tg.el.classList.add("nopress") } },{passive:true,capture:true});
addEventListener("touchend",e=>{ if(!tg) return; const t=e.changedTouches[0], r=tg.el.getBoundingClientRect();
  const out=t.clientX<r.left-4||t.clientX>r.right+4||t.clientY<r.top-4||t.clientY>r.bottom+4;
  if(tg.moved||out) cancelUntil=performance.now()+600;
  const el=tg.el; tg=null; setTimeout(()=>el.classList.remove("nopress"),300) },{passive:true,capture:true});
addEventListener("click",e=>{ if(performance.now()<cancelUntil){ cancelUntil=0; e.preventDefault(); e.stopImmediatePropagation() } },true);

/* Sichtbare Antworten: Welle für Aktionen, einlaufende Füllung für Auswahl */
let lastSel=null;
function ripple(el,x,y){
  if(RM()) return;
  const r=el.getBoundingClientRect(), s=document.createElement("span");
  const d=Math.max(r.width,r.height)*2.2;
  s.className="rip"; s.style.cssText=`width:${d}px;height:${d}px;left:${x-r.left-d/2}px;top:${y-r.top-d/2}px`;
  el.appendChild(s); setTimeout(()=>s.remove(),650);
}
function feedbackFor(el,e){
  const f=famOf(el); if(!f) return;
  const x=e.clientX||0, y=e.clientY||0, r=el.getBoundingClientRect();
  if(f==="act"&&!(x===0&&y===0)) ripple(el,x,y);
  if(f==="sel"){ lastSel={sig:sigOf(el),fx:((x-r.left)/r.width*100)||50,fy:((y-r.top)/r.height*100)||50,t:performance.now()} }
  if(f==="logo"&&!RM()){ el.classList.remove("spin"); void el.offsetWidth; el.classList.add("spin") }
}
function sigOf(el){ return (el.dataset.a||"")+"|"+(el.dataset.v||"")+"|"+(el.dataset.w||"") }
/* Nach dem Neuzeichnen: die gerade gewählte Option läuft vom Fingerpunkt aus voll */
function settleSel(root){
  if(!lastSel||performance.now()-lastSel.t>900||RM()) return;
  const sig=lastSel.sig;
  (root||document).querySelectorAll(FAM_SEL).forEach(el=>{
    if(sigOf(el)===sig&&(el.classList.contains("on")||el.getAttribute("aria-pressed")==="true")){
      el.style.setProperty("--fx",lastSel.fx+"%"); el.style.setProperty("--fy",lastSel.fy+"%");
      el.classList.remove("fill-in"); void el.offsetWidth; el.classList.add("fill-in");
    }
  });
  lastSel=null;
}
/* Fehler: kleine Seitwärtsbewegung */
function shake(el){ if(!el||RM()) return; el.classList.remove("shake"); void el.offsetWidth; el.classList.add("shake") }

/* ===== Das Hauptbild: die Lichtung als Radierung =====
   Regeln des Systems:
   1. Alles ist aus Strichen gezeichnet. Ton entsteht durch Strichdichte, nicht durch Flächen.
   2. Gold ist nur Licht. Es erscheint ausschließlich dort, wo Platz entstanden ist.
   3. Farbe tragen nur die bewusst behaltenen Dinge (ihre Kronen) und die Wildblumen.
   4. Eine einzige Dauerbewegung: Lichtstaub im Strahl (nachts Glühwürmchen). */
const Bild=(function(){
  function mulberry(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296 } }
  function hash(s){ let h=2166136261; for(const c of String(s)){ h^=c.charCodeAt(0); h=Math.imul(h,16777619) } return h>>>0 }
  const css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();

  /* Bäume einmal deterministisch erzeugen (in Einheiten von 0..1) */
  let TREES=null;
  function trees(){
    if(TREES) return TREES;
    const R=mulberry(20261019), T=[];
    // Reihen von hinten nach vorn; vorn wenige große, hinten viele kleine Stämme
    const rows=[[0.395,26],[0.43,22],[0.47,19],[0.51,17],[0.55,15],[0.60,13],[0.65,12],[0.70,11],[0.76,10],[0.82,9],[0.89,6],[0.96,5],[1.04,4]];
    rows.forEach(([y,n],ri)=>{
      for(let i=0;i<n;i++){
        const x=(i+0.15+R()*0.7)/n*1.12-0.06;
        const yy=y+(R()-0.5)*0.03;
        const d=(yy-0.38)/0.66;              // Tiefe 0 hinten … 1 vorn
        const s=0.30+d*1.0;
        T.push({x,y:yy,d,s,j:0.82+R()*0.36,seed:Math.floor(R()*1e9),
          crown:0.85+R()*0.45, lean:(R()-0.5)*0.025, kind:R()<0.22?"tanne":"laub"});
      }
    });
    T.sort((a,b)=>a.y-b.y);
    TREES=T; return T;
  }

  const C={x:0.5,y:0.665};      // Mitte der Lichtung
  const RX=0.64, RY=0.31;        // größte Ausdehnung

  function season(dt){ const m=dt.getMonth(); return m<=1||m===11?"winter":m<=4?"fruehling":m<=7?"sommer":"herbst" }
  function snowDay(dt){ const m=dt.getMonth(); if(!(m<=1||(m===11&&dt.getDate()>=15))) return false;
    return hash("schnee"+dt.getFullYear()+"-"+m+"-"+dt.getDate())%3===0 }
  function dayPhase(dt){ const h=dt.getHours()+dt.getMinutes()/60;
    if(h<5||h>=22) return {k:"nacht",sun:0.5};
    const sun=Math.min(0.88,Math.max(0.12,0.12+(h-6)/14*0.76));
    return {k:(h<8||h>=19)?"daemmerung":"tag",sun} }

  /* ---------- Zeichenhilfen ---------- */
  function hatch(g,path,ang,gap,lw,col,alpha,bb,clip2){
    g.save(); g.beginPath(); path(); g.clip(); if(clip2){ g.beginPath(); clip2(); g.clip() } else if(bb){ g.beginPath(); g.rect(bb[0],bb[1],bb[2]-bb[0],bb[3]-bb[1]); g.clip() }
    g.strokeStyle=col; g.globalAlpha=alpha; g.lineWidth=lw; g.beginPath();
    const [x0,y0,x1,y1]=bb, cx=(x0+x1)/2, cy=(y0+y1)/2, L=Math.hypot(x1-x0,y1-y0)/2+2;
    const ca=Math.cos(ang), sa=Math.sin(ang);
    for(let t=-L;t<=L;t+=gap){ const px=cx-sa*t, py=cy+ca*t; g.moveTo(px-ca*L,py-sa*L); g.lineTo(px+ca*L,py+sa*L) }
    g.stroke(); g.restore();
  }
  function foliage(g,cx,cy,w,h,R,n){
    n=n||16; const pts=[];
    for(let i=0;i<n;i++){ const a=i/n*Math.PI*2; const k=0.80+R()*0.32; pts.push([cx+Math.cos(a)*w*0.5*k, cy+Math.sin(a)*h*0.5*k*(a>0&&a<Math.PI?0.82:1)]) }
    return ()=>{ for(let i=0;i<=n;i++){ const p=pts[i%n], q=pts[(i+1)%n]; if(i===0){ g.moveTo(p[0],p[1]); continue }
      const mx=(pts[(i-1)%n][0]+p[0])/2, my=(pts[(i-1)%n][1]+p[1])/2, ox=mx-cx, oy=my-cy, L=Math.hypot(ox,oy)||1, b=Math.min(w,h)*0.09;
      g.quadraticCurveTo(mx+ox/L*b,my+oy/L*b,p[0],p[1]) } g.closePath() };
  }
  function blob(g,cx,cy,w,h,R,n){
    // Krone als Wolke aus Kreisen, deterministisch
    const pts=[]; for(let i=0;i<n;i++){ const a=i/n*Math.PI*2+R()*0.6; pts.push([cx+Math.cos(a)*w*0.36*(0.7+R()*0.4), cy+Math.sin(a)*h*0.34*(0.7+R()*0.4), Math.min(w,h)*(0.30+R()*0.16)]) }
    pts.push([cx,cy,Math.min(w,h)*0.42]);
    return ()=>{ pts.forEach(([x,y,r])=>{ g.moveTo(x+r,y); g.arc(x,y,r,0,Math.PI*2) }) };
  }

  /* ---------- Szene ---------- */
  function draw(g,W,H,m,opt){
    opt=opt||{};
    const u=W/354, P=m.pal, dt=m.date||new Date();
    const se=season(dt), ph=dayPhase(dt), snow=snowDay(dt);
    const r=m.r, rx=r*RX*W, ry=r*RY*H, cx=C.x*W, cy=C.y*H;
    const ink=P.ink, paper=P.paper, lit=P.lit;
    const st=m.stage;
    g.clearRect(0,0,W,H);
    g.fillStyle=paper; g.fillRect(0,0,W,H);

    // Himmel (sichtbar nur durch Lücken): leichte waagerechte Linien
    g.save(); g.strokeStyle=P.sky; g.lineWidth=0.6*u;
    for(let y=3*u;y<0.40*H;y+=3*u){ g.globalAlpha=(ph.k==="nacht"?0.55:0.20)*(1-y/(0.40*H))**0.7; g.beginPath(); g.moveTo(0,y); g.lineTo(W,y); g.stroke() } g.restore();
    if(ph.k==="nacht"){ const R=mulberry(hash("sterne"+dkeyB(dt))); g.fillStyle=P.star;
      for(let i=0;i<60;i++){ g.globalAlpha=0.4+R()*0.6; g.beginPath(); g.arc(R()*W,R()*0.36*H,(0.5+R()*0.9)*u,0,7); g.fill() } g.globalAlpha=1;
      g.strokeStyle=P.star; g.lineWidth=1*u; g.beginPath(); g.arc(W*0.62,H*0.12,7*u,0,7); g.stroke();
      hatch(g,()=>g.arc(W*0.62,H*0.12,7*u,0,7),0.3,1.6*u,0.6*u,P.star,0.6,[W*0.62-8*u,H*0.12-8*u,W*0.62+8*u,H*0.12+8*u]);
    }
    if(st>=8){ // Wolken: Bündel waagerechter Striche, wie in einer Radierung
      const R=mulberry(11); g.save(); g.strokeStyle=ink; g.lineWidth=0.7*u; g.lineCap="round";
      [[0.30,0.075,1],[0.66,0.14,0.8],[0.50,0.035,0.55]].forEach(([x,y,s])=>{
        const X=x*W, Y=y*H, w=60*u*s;
        for(let i=0;i<6;i++){ const yy=Y+i*2.4*u, f=Math.sin((i+0.6)/6.6*Math.PI), l=w*f*(0.75+R()*0.3), off=(R()-0.5)*8*u;
          g.globalAlpha=0.55-i*0.05; g.beginPath(); g.moveTo(X-l/2+off,yy); g.lineTo(X+l/2+off,yy); g.stroke() } });
      g.restore();
    }
    if(st>=9){ // Hügel am Horizont
      g.save(); g.strokeStyle=ink; g.lineWidth=0.9*u; g.globalAlpha=0.55; const y0=0.40*H;
      const hill=()=>{ g.moveTo(-5,y0); g.bezierCurveTo(W*0.2,y0-26*u,W*0.36,y0-10*u,W*0.5,y0-22*u); g.bezierCurveTo(W*0.64,y0-34*u,W*0.8,y0-6*u,W+5,y0-14*u); g.lineTo(W+5,y0+4*u); g.lineTo(-5,y0+4*u); g.closePath() };
      g.beginPath(); hill(); g.stroke(); hatch(g,()=>{hill()},-0.35,2.8*u,0.5*u,ink,0.35,[0,y0-40*u,W,y0+6*u]); g.restore();
    }

    // Boden: waagerechte Schraffur, nach vorn weiter
    const y0=0.385*H;
    g.save(); g.strokeStyle=ink; g.lineWidth=0.6*u;
    { const R=mulberry(91); let gap=1.5*u; for(let y=y0;y<H;y+=gap){ const k=(y-y0)/(H-y0); g.globalAlpha=0.16+0.22*k; g.beginPath();
      let x=-R()*20*u; while(x<W){ const l=(6+R()*26)*u*(0.5+k); g.moveTo(x,y); g.lineTo(x+l,y); x+=l+(2+R()*10)*u*(0.5+k) } g.stroke(); gap*=1.04 } }
    g.restore();

    // Licht auf dem Boden der Lichtung
    const lightCol=ph.k==="nacht"?P.moon:lit;
    const lx=cx+(ph.sun-0.5)*rx*0.25;
    function floorPath(){ g.ellipse(cx,cy,Math.max(rx,0.05*W)*0.96,Math.max(ry,0.03*H)*0.92,0,0,Math.PI*2) }
    g.save(); g.fillStyle=paper; g.beginPath(); floorPath(); g.fill(); g.restore();
    { const RX2=Math.max(rx,0.10*W), RY2=Math.max(ry,0.045*H);
      g.save(); g.globalCompositeOperation=P.dark?"lighter":"multiply"; g.translate(lx,cy); g.scale(1,RY2/RX2);
      const gr=g.createRadialGradient(0,0,0,0,0,RX2*1.05); const a=(P.dark?0.30:0.46)*(ph.k==="nacht"?0.6:1);
      gr.addColorStop(0,rgba(lightCol,a)); gr.addColorStop(0.55,rgba(lightCol,a*0.6)); gr.addColorStop(1,rgba(lightCol,0));
      g.fillStyle=gr; g.beginPath(); g.arc(0,0,RX2*1.05,0,7); g.fill(); g.restore() }
    // ganz feine Bodenlinien in der Lichtung
    hatch(g,()=>floorPath(),0,3.4*u,0.5*u,ink,0.20,[cx-rx,cy-ry,cx+rx,cy+ry]);
    if(snow){ g.save(); g.fillStyle=P.snow; g.globalAlpha=0.9; g.beginPath(); floorPath(); g.fill(); g.restore();
      const R=mulberry(hash("spur"+dkeyB(dt))); g.fillStyle=ink; g.globalAlpha=0.5; let x=cx-rx*0.7, y=cy+ry*0.3;
      for(let i=0;i<14;i++){ g.beginPath(); g.ellipse(x+(i%2?3*u:0),y,1.1*u,1.6*u,0.4,0,7); g.fill(); x+=rx*0.09; y-=ry*0.035+R()*ry*0.02 } g.globalAlpha=1 }
    if(st>=3&&!snow){ const R=mulberry(33); g.fillStyle=P.moss;
      for(let i=0;i<Math.round(260*r);i++){ const a=R()*7, q=Math.sqrt(R())*0.92; const x=cx+Math.cos(a)*rx*q, y=cy+Math.sin(a)*ry*q;
        g.globalAlpha=0.35+R()*0.4; g.beginPath(); g.arc(x,y,(0.6+R()*0.8)*u,0,7); g.fill() } g.globalAlpha=1 }
    if(st>=6){ // Tümpel
      const px=cx+rx*0.30, py=cy+ry*0.30, pw=Math.min(30*u,rx*0.28), phh=pw*0.32;
      g.save(); g.fillStyle=paper; g.beginPath(); g.ellipse(px,py,pw,phh,0,0,7); g.fill();
      g.strokeStyle=ink; g.lineWidth=0.9*u; g.globalAlpha=0.8; g.stroke(); g.restore();
      hatch(g,()=>g.ellipse(px,py,pw,phh,0,0,7),0,1.9*u,0.6*u,P.sky,0.9,[px-pw,py-phh,px+pw,py+phh]);
      g.save(); g.globalAlpha=0.6; g.strokeStyle=lit; g.lineWidth=1.2*u; g.beginPath(); g.moveTo(px-pw*0.4,py-phh*0.1); g.lineTo(px+pw*0.1,py-phh*0.1); g.stroke(); g.restore();
    }
    if(st>=7&&!snow){ // Wildblumen in den Farben der Bereiche
      const R=mulberry(77), cols=P.area;
      for(let i=0;i<Math.round(70*r);i++){ const a=R()*7, q=0.25+Math.sqrt(R())*0.65, x=cx+Math.cos(a)*rx*q, y=cy+Math.sin(a)*ry*q;
        if(st>=6&&Math.hypot((x-(cx+rx*0.30))/(rx*0.32),(y-(cy+ry*0.30))/(ry*0.22))<1.1) continue;
        g.strokeStyle=ink; g.globalAlpha=0.6; g.lineWidth=0.5*u; g.beginPath(); g.moveTo(x,y); g.lineTo(x,y-4*u); g.stroke();
        g.globalAlpha=0.95; g.fillStyle=se==="winter"?ink:cols[i%cols.length]; g.beginPath(); g.arc(x,y-4.6*u,se==="winter"?0.9*u:1.5*u,0,7); g.fill() } g.globalAlpha=1 }
    if(st>=5){ // Baumstumpf
      const sx=cx-rx*0.32, sy=cy+ry*0.12, sw=Math.max(7*u,9*u*(0.6+r*0.5)), sh=sw*0.38;
      g.save(); g.fillStyle=paper; g.beginPath(); g.rect(sx-sw,sy,sw*2,sw*0.9); g.ellipse(sx,sy+sw*0.9,sw,sh,0,0,Math.PI); g.fill(); g.restore();
      hatch(g,()=>{g.rect(sx-sw,sy,sw*2,sw*0.9)},Math.PI/2,1.5*u,0.6*u,ink,0.7,[sx-sw,sy,sx+sw,sy+sw]);
      g.save(); g.fillStyle=paper; g.strokeStyle=ink; g.lineWidth=0.8*u; g.beginPath(); g.ellipse(sx,sy,sw,sh,0,0,7); g.fill(); g.stroke();
      g.globalAlpha=0.55; for(let k=1;k<4;k++){ g.beginPath(); g.ellipse(sx,sy,sw*k/4,sh*k/4,0,0,7); g.stroke() } g.restore();
    }
    if(st>=4){ // Farne am Rand
      [[-0.92,0.30,1],[0.90,0.20,-1],[-0.70,0.70,1],[0.62,0.78,-1]].forEach(([ax,ay,dir],k)=>{
        const fx=cx+ax*rx, fy=cy+ay*ry, L=(12+6*(k%2))*u*(0.6+r*0.6);
        g.save(); g.strokeStyle=P.moss; g.lineWidth=0.8*u; g.globalAlpha=0.9;
        for(let f=0;f<3;f++){ const a=-Math.PI/2+dir*(0.25+f*0.38); g.beginPath();
          const ex=fx+Math.cos(a)*L, ey=fy+Math.sin(a)*L; g.moveTo(fx,fy); g.quadraticCurveTo(fx+Math.cos(a)*L*0.5-dir*3*u,fy+Math.sin(a)*L*0.6,ex,ey); g.stroke();
          for(let t=0.2;t<1;t+=0.12){ const px=fx+(ex-fx)*t, py=fy+(ey-fy)*t, l=(1-t)*4*u; g.beginPath(); g.moveTo(px,py); g.lineTo(px-l*0.7,py-l); g.moveTo(px,py); g.lineTo(px+l*0.7,py-l*0.6); g.stroke() } }
        g.restore(); });
    }

    // Pfad nach außen: jedes Teilen legt ein Stück
    const pathPts=[]; if(m.paths>0){ const n=Math.min(8,m.paths);
      const p0=[cx+rx*0.35,cy+ry*0.55], p1=[cx+rx*0.9+20*u,cy+ry*1.1+18*u], p2=[W*1.04,H*1.01];
      for(let i=0;i<=40*n/8;i++){ const t=i/40; const a=(1-t)*(1-t), b=2*(1-t)*t, c=t*t; pathPts.push([a*p0[0]+b*p1[0]+c*p2[0],a*p0[1]+b*p1[1]+c*p2[1],t]) } }

    // Bäume, Licht und Überhälter in der richtigen Reihenfolge
    const T=trees(), keepers=placeKeepers(m,W,H,u,rx,ry,cx,cy);
    const hits=[];
    const shaftOn=st>=2, sunX=ph.sun*W;
    let shaftDrawn=false;
    function shaft(){
      shaftDrawn=true; if(!shaftOn) return;
      g.save(); g.globalCompositeOperation=P.dark?"lighter":"multiply"; g.fillStyle=lightCol;
      const a=(P.dark?0.10:0.17)*(ph.k==="nacht"?0.5:ph.k==="daemmerung"?0.85:1)*Math.min(1,0.5+r);
      g.globalAlpha=a; g.beginPath();
      g.moveTo(sunX-rx*0.10-6*u,0); g.lineTo(sunX+rx*0.18+10*u,0); g.lineTo(lx+rx*0.62,cy+ry*0.2); g.lineTo(lx-rx*0.62,cy+ry*0.2); g.closePath(); g.fill();
      g.globalAlpha=a*0.9; g.beginPath(); g.moveTo(sunX-2*u,0); g.lineTo(sunX+rx*0.08+4*u,0); g.lineTo(lx+rx*0.28,cy+ry*0.1); g.lineTo(lx-rx*0.28,cy+ry*0.1); g.closePath(); g.fill(); g.restore();
    }
    let ki=0;
    for(const t of T){
      // Lichtung ab der Mitte: Licht vor allem, was dahinter steht
      if(!shaftDrawn&&t.y*H>cy) shaft();
      while(ki<keepers.length&&keepers[ki].y<=t.y*H){ drawKeeper(g,keepers[ki],u,P); hits.push(keepers[ki]); ki++ }
      const x=t.x*W, y=t.y*H;
      const e=Math.pow((x-cx)/Math.max(rx,1),2)+Math.pow((y-cy)/Math.max(ry*(y>cy?1.7:1.35),1),2);
      const backWall=y<0.47*H&&!(st>=9&&Math.abs(x-cx)<0.15*W);
      if(e<t.j*t.j&&!backWall) continue;
      if(keepers.some(k=>Math.abs(k.x-x)<k.w*0.9&&Math.abs(k.y-y)<9*u)) continue;
      if(keepers.some(k=>y>k.y-4*u&&y<k.y+0.32*H&&Math.abs(k.x-x)<k.w*1.1+5*u)) continue;
      if(st>=1&&y>cy&&Math.abs(x-cx)<0.07*W) continue;
      if(pathPts.some(p=>Math.abs(p[0]-x)<(6+t.s*7)*u&&Math.abs(p[1]-y)<(5+t.s*5)*u)) continue;
      drawTree(g,t,x,y,W,H,u,P,se,ph);
    }
    if(!shaftDrawn) shaft();
    while(ki<keepers.length){ drawKeeper(g,keepers[ki],u,P); hits.push(keepers[ki]); ki++ }

    // Pfad selbst
    if(pathPts.length>1){ g.save(); g.strokeStyle=ink; g.lineWidth=0.7*u;
      for(const side of [-1,1]){ g.globalAlpha=0.45; g.setLineDash([3*u,2.5*u]); g.beginPath(); pathPts.forEach(([x,y,t],i)=>{ const w=(1.8+t*6)*u*side; i?g.lineTo(x,y+w):g.moveTo(x,y+w) }); g.stroke() }
      g.setLineDash([]); g.fillStyle=paper; pathPts.forEach(([x,y,t],i)=>{ if(i%3) return; const w=(1.2+t*3.2)*u; g.globalAlpha=0.9; g.beginPath(); g.ellipse(x,y,w*1.3,w*0.6,0,0,7); g.fill(); g.globalAlpha=0.7; g.stroke() }); g.restore() }

    // Keimlinge am Rand: wartende Wünsche
    for(let i=0;i<Math.min(9,m.seeds);i++){ const a=Math.PI*(0.62+i*0.075), sx=cx+Math.cos(a)*rx*1.02, sy=cy+Math.sin(a)*ry*1.02+4*u;
      g.save(); g.strokeStyle=ink; g.lineWidth=0.9*u; g.globalAlpha=0.85; g.beginPath(); g.moveTo(sx,sy); g.lineTo(sx,sy-7*u);
      g.moveTo(sx,sy-5*u); g.quadraticCurveTo(sx-4*u,sy-8*u,sx-5*u,sy-5*u); g.moveTo(sx,sy-6*u); g.quadraticCurveTo(sx+4*u,sy-10*u,sx+5*u,sy-7*u); g.stroke();

  function drawTree(g,t,x,y,W,H,u,P,se,ph){

      Math.PI/2+0.05,(1.3+ (1-t.d)*0.8)*u,0.5*u,ink,alpha*0.9,[x-tw,top,x+tw,y]);

      hatch(g,f,a0+0.7,gap*0.9,lw*0.8,ink,al*0.7,bbx,()=>g.ellipse(lx+sd*w*0.25,ly+h*0.78,w*0.7,h*0.5,0,0,7));

    });
    if(se==="herbst"&&R()<0.45){ g.save(); g.strokeStyle=P.leaf; g.lineWidth=(0.8+t.d*0.6)*u; g.lineCap="round";
      for(let i=0;i<7;i++){ g.globalAlpha=0.7+R()*0.3; const a=R()*7, q=Math.sqrt(R())*0.42, px=ccx+Math.cos(a)*cw*q, py=ccy+Math.sin(a)*ch*q*0.8; g.beginPath(); g.moveTo(px,py); g.lineTo(px+1.6*u,py+1.1*u); g.stroke() } g.restore() }

  }

  /* Bewusst behaltene Dinge: einzelne Bäume in der Lichtung, Krone in der Farbe des Bereichs */
  function placeKeepers(m,W,H,u,rx,ry,cx,cy){
    const K=m.keep||[], out=[];
    const n=K.length; if(!n) return out;
    const rrx=Math.max(rx,(0.20+0.03*n)*RX*W), rry=Math.max(ry,(0.20+0.03*n)*RY*H);
    K.forEach((k,i)=>{
      const a=i*2.39996+0.6, q=0.30+0.52*Math.sqrt((i+0.5)/MAXKEEP);
      const x=cx+Math.cos(a)*rrx*q*0.95, y=cy+Math.sin(a)*rry*q*0.85;
      const d=Math.max(0,(y/H-0.38)/0.66), s=0.42+d*0.75;
      out.push({id:k.id,cat:k.cat,why:k.why,x,y,s,w:(0.035+0.07*d)*W,h:(0.13+0.30*d)*H,fresh:k.fresh});
    });
    return out.sort((a,b)=>a.y-b.y);
  }
  function drawKeeper(g,k,u,P){
    const col=P.areaMap[k.cat]||P.ink, ink=P.ink, paper=P.paper;
    const x=k.x, y=k.y, th=k.h, tw=(1.2+k.s*3.2)*u, top=y-th;
    // Schatten am Boden
    g.save(); g.globalAlpha=0.25; g.fillStyle=ink; g.beginPath(); g.ellipse(x,y+1*u,k.w*0.7,2.5*u*k.s,0,0,7); g.fill(); g.restore();
    const trunk=()=>{ g.moveTo(x-tw,y); g.lineTo(x-tw*0.5,top+th*0.3); g.lineTo(x+tw*0.5,top+th*0.3); g.lineTo(x+tw,y); g.closePath() };
    g.save(); g.fillStyle=paper; g.beginPath(); trunk(); g.fill(); g.strokeStyle=ink; g.lineWidth=0.8*u; g.stroke(); g.restore();
    if(k.why==="gut"){ // Birke: helle Rinde mit Querstrichen
      g.save(); g.strokeStyle=ink; g.lineWidth=0.8*u; for(let yy=y-4*u;yy>top+th*0.32;yy-=5*u){ g.beginPath(); g.moveTo(x-tw*0.6,yy); g.lineTo(x+tw*0.2,yy-1*u); g.stroke() } g.restore();
    } else hatch(g,trunk,Math.PI/2,1.4*u,0.5*u,ink,0.6,[x-tw,top,x+tw,y]);

    const R=mulberry(hash(k.id));
    const shape=k.why==="kann"?()=>{ g.moveTo(x,ccy-ch*0.65); g.lineTo(x+cw*0.5,ccy+ch*0.5); g.lineTo(x-cw*0.5,ccy+ch*0.5); g.closePath() }
      : foliage(g,x,ccy,cw,ch,R,k.why==="sinn"?18:14);

    hatch(g,shape,-0.8,1.7*u,0.8*u,col,0.95,[x-cw,ccy-ch,x+cw,ccy+ch]);
    hatch(g,shape,0.55,2.1*u,0.55*u,col,0.7,[x-cw,ccy-ch,x+cw,ccy+ch],()=>g.ellipse(x+cw*0.3,ccy+ch*0.3,cw*0.55,ch*0.5,0,0,7));
    g.save(); g.strokeStyle=col; g.lineWidth=0.8*u; g.globalAlpha=0.9; g.beginPath(); shape(); g.stroke(); g.restore();

  }
  function rgba(hex,a){ const h=hex.replace('#',''); const n=parseInt(h.length===3?h.split('').map(c=>c+c).join(''):h,16); return `rgba(${n>>16&255},${n>>8&255},${n&255},${a})` }
  function dkeyB(d){ return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate() }

  /* ---------- Bühne mit Zwischenspeicher und der einen Dauerbewegung ---------- */
  let cv=null, ctx=null, base=null, prev=null, info=null, model=null, raf=0, io=null, visible=true, fadeT0=0, ringT0=0, ringAt=null, last=0, motes=[], reh=null;
  function pal(){
    const dark=document.documentElement.dataset.dark==="1";
    const ar=["kl","wo","pa","er","ko"].map(id=>css("--c-"+id));
    return {dark,ink:css("--img-ink"),paper:css("--img-paper"),lit:css("--lit"),sky:css("--img-sky"),moon:css("--img-moon"),star:css("--img-star"),
      moss:css("--c-ko"),leaf:css("--c-wo"),blossom:css("--img-blossom"),snow:css("--img-snow"),snowCaps:true,area:ar,
      areaMap:Object.fromEntries(["kl","wo","pa","er","ko"].map((id,i)=>[id,ar[i]]))};
  }
  function makeLayer(W,H,dpr,m){
    const c=document.createElement("canvas"); c.width=Math.round(W*dpr); c.height=Math.round(H*dpr);

  function layerFor(W,H,dpr,m){ const k=keyOf(m,W,dpr); let L=cache.get(k); if(!L){ L=makeLayer(W,H,dpr,m); cache.set(k,L); if(cache.size>4) cache.delete(cache.keys().next().value) } return L }
  function mount(canvas,m,fromModel){

    const {W,H,dpr}=size(); cv.width=Math.round(W*dpr); cv.height=Math.round(H*dpr); cv.style.height=H+"px";
    const L=layerFor(W,H,dpr,m); base=L.c; info=L.inf;

      let x,y;
      if(night){ // Glühwürmchen über der Lichtung
        x=info.cx+(m.a-0.5)*info.rx*1.6+Math.sin(tt*m.sp*0.6+m.ph)*8*u; y=info.cy-(m.b*0.8)*info.ry*1.4+Math.cos(tt*m.sp*0.5+m.ph)*5*u;

    ctx.restore();
  }

})();

    if(e.k==="los"){ let v=e.size;
      if(e.size===1){ cap["s"+d]=(cap["s"+d]||0)+1; if(cap["s"+d]>5) v=0 }
      if(e.weg==="mue"||e.weg==="rec") v=Math.ceil(v/2);
      const used=cap["l"+d]||0; p=Math.max(0,Math.min(v,LOSCAP-used)); cap["l"+d]=used+p }
    else if(e.k==="teil"){ cap["t"+d]=(cap["t"+d]||0)+1; p=cap["t"+d]<=2?(e.how==="gebr"?1:3):0 }

const weite=()=>tally().W;
function stageOf(W){ let s=0; STUFEN.forEach((x,i)=>{ if(W>=x.w) s=i }); return s }
function rOf(W){ return 0.14+0.78*Math.pow(Math.min(W,300)/300,0.4) }

/* ---------- Abgeleitete Listen ---------- */
const losE=()=>S.log.filter(e=>e.k==="los");

const waiting=()=>S.wishes.filter(w=>w.st==="wait");
const isDue=t=>day0(now())>=day0(t);

const boxIn=()=>S.box.filter(b=>b.st==="in");

const exRun=()=>Object.entries(S.ex).filter(([id,e])=>e.st==="run"&&UEB[id]);
function exDay(e){ return daysBetween(e.start,now())+1 }
function exTodayOpen(){ return exRun().filter(([id,e])=>exDay(e)<=UEB[id].d&&e.days[dkey()]==null) }
function exEvalDue(){ return exRun().filter(([id,e])=>exDay(e)>UEB[id].d||(exDay(e)===UEB[id].d&&e.days[dkey()]!=null)) }
function stats(){
  const L=losE(), asked=L.filter(e=>e.miss!=null&&e.miss!=="wn"), missed=asked.filter(e=>e.miss==="ja");
  const given=L.filter(e=>WEG[e.weg]&&WEG[e.weg].g).length;

}

/* ---------- Stationen je Bereich ---------- */
function stations(a){
  const hs=(S.check&&CHECK.some(c=>c.cat===a&&S.check.ans[c.id]!=null))||S.pr.some(p=>p.cat===a);
  const exd=Object.entries(S.ex).some(([id,e])=>e.st==="done"&&e.lived&&UEB[id]&&UEB[id].cat===a);
  if(a==="ko") return [hs, S.wishes.length>0, S.log.some(e=>e.k==="teil"), exd, S.wishes.some(w=>w.st!=="wait"&&w.waited)];
  const n2=a==="er"?losE().filter(e=>e.cat==="er").length+S.pr.filter(p=>p.cat==="er"&&p.choice!=="none").length+S.keep.filter(k=>k.cat==="er").length:losE().filter(e=>e.cat===a).length;
  return [hs, n2>=3, keepers().some(k=>k.cat===a)||S.keep.some(k=>k.cat===a),
    exd, losE().some(e=>e.cat===a&&e.miss!=null)||S.keep.some(k=>k.cat===a&&k.answered)||S.box.some(b=>b.cat===a&&b.st!=="in")];

function areaOrder(){ const top=S.check?S.check.top:[]; return [...top,...AREAS.map(a=>a.id).filter(id=>!top.includes(id))] }

/* ---------- Genau ein nächster Schritt ---------- */
function nextStep(){
  const wd=wishDue(); if(wd.length) return {m:"Ein Wunsch hat gewartet",t:"„"+wd[0].name+"“: Willst du es noch?",x:"Die Wartezeit ist vorbei. Jetzt entscheidest du mit kühlem Kopf.",a:"open",v:"wishdec",w:wd[0].id,b:"Entscheiden"};
  if(boxDue().length) return {m:"Vielleicht-Kiste",t:"Die Kiste ist dreißig Tage zu",x:"Schau nach, was du in der Zeit gebraucht hast und was gehen kann.",a:"open",v:"kistedue",b:"Kiste öffnen"};
  const ad=askDue(); if(ad.length) return {m:"Nachfrage",t:ad.length===1?"Hast du „"+(ad[0].name||"es")+"“ vermisst?":"Hast du etwas vermisst?",x:(ad.length===1?"Am "+fdate(ad[0].ts)+" hast du es weitergegeben.":"Seit dem "+fdate(Math.min(...ad.map(e=>e.ts)))+" hast du "+ad.length+" Dinge weitergegeben.")+" Deine Antwort zeigt dir, wie leicht dir Loslassen fällt.",a:"open",v:"ask",b:"Antworten"};
  const kd=keepAskDue(); if(kd.length) return {m:"Nachfrage",t:"Stimmt der Grund noch?",x:"Du hast „"+kd[0].name+"“ bewusst behalten. Gilt dein Grund noch?",a:"open",v:"keepask",w:kd[0].id,b:"Nachsehen"};
  const ee=exEvalDue(); if(ee.length) return {m:"Übung vorbei",t:UEB[ee[0][0]].t,x:"Das war der letzte Tag. Wie ist es gelaufen?",a:"open",v:"ueb",w:ee[0][0],b:"Auswerten"};
  const et=exTodayOpen(); if(et.length) return {m:"Übung läuft",t:UEB[et[0][0]].t,x:"Tag "+exDay(et[0][1])+" von "+UEB[et[0][0]].d+". Wie lief es heute?",a:"open",v:"ueb",w:et[0][0],b:"Eintragen"};
  if(!S.check) return {m:"Zum Anfang",t:"Mach die Bestandsaufnahme",x:"Zehn kurze Fragen zeigen, wo Besitz dir gerade am meisten Druck macht. Das dauert etwa zwei Minuten.",a:"open",v:"check",b:"Beginnen"};

      if(i===4){ if(waiting().length) continue; return {m:n,t:"Lass einen Wunsch die volle Zeit warten",x:"Parke einen Wunsch und entscheide erst, wenn die Wartezeit um ist.",a:"open",v:"wish",b:"Wunsch parken"} }
    } else {
      if(i===1&&a==="er") return {m:n,t:"Entscheide über ein Erinnerungsstück",x:"Ein Foto und eine kurze Geschichte helfen beim Entscheiden. Es kann bleiben, in die Kiste kommen oder weitergehen. Drei Entscheidungen ergeben die nächste Station.",a:"open",v:"pruef",w:a,b:"Ding prüfen"};
      if(i===1){ const c=losE().filter(e=>e.cat===a).length; return {m:n,t:"Gib etwas aus „"+n+"“ weiter",x:c?"Noch "+(3-c)+" bis zur nächsten Station. Eine Tüte zählt als ein Eintrag.":"Such dir ein Ding, das jemand anderes besser brauchen kann.",a:"open",v:"los",w:a,b:"Loslassen eintragen"} }
      if(i===2) return {m:n,t:"Was aus „"+n+"“ darf bleiben?",x:"Nenne ein Ding, das du bewusst behältst, und den Grund dafür.",a:"open",v:"keep",w:a,b:"Behalten eintragen"};
      if(i===4){ const pend=losE().some(e=>e.cat===a&&e.miss==null)||boxIn().some(b=>b.cat===a); if(pend) continue;
        return {m:n,t:"Leg Unsicheres in die Vielleicht-Kiste",x:"Dinge aus „"+n+"“, bei denen du schwankst, kommen für dreißig Tage in eine Kiste. Danach fällt die Entscheidung leichter.",a:"open",v:"kiste",w:a,b:"Zur Kiste"} }
    }
    if(i===3){ const u=pickUeb(a); if(u&&!S.ex[u.id]) return {m:n,t:"Probier die Übung „"+u.t+"“",x:u.d===1?"Dauert einen Tag.":"Dauert "+u.d+" Tage.",a:"open",v:"ueb",w:u.id,b:"Ansehen"}; if(exRun().length) continue }
  }
  return {m:"Für heute",t:"Prüfe ein Ding",x:"Nimm ein Ding in die Hand, bei dem du unsicher bist. Fünf Fragen helfen beim Entscheiden.",a:"open",v:"pruef",b:"Ding prüfen"};
}
function pickUeb(a){ const L=UEBUNGEN.filter(u=>u.cat===a&&!(S.ex[u.id]&&S.ex[u.id].st!=="stop")); return L.sort((x,y)=>x.d-y.d)[0]||null }

function bildModel(W,keepL,o){

  const faded=S.wishes.filter(w=>w.st==="lass"||w.st==="leih").length;
  return {r:rOf(W),stage:st,keep:keepL.map(k=>({id:k.id,cat:k.cat,why:k.why})),paths:S.log.filter(e=>e.k==="teil").length,

function mountBild(){
  const cv=$("#bild"); if(!cv) return;
  const W=weite(), K=keepers(), st=stageOf(W);
  const sig={w:W,k:K.map(k=>k.id).join(","),p:S.log.filter(e=>e.k==="teil").length,s:waiting().length};
  const sh=S.shown;
  let from=null;
  if(sh&&(sh.w!==W||sh.k!==sig.k||sh.p!==sig.p)){
    const oldK=K.filter(k=>sh.k.split(",").includes(k.id));
    from=bildModel(Math.min(sh.w,W),oldK); from.stage=stageOf(Math.min(sh.w,W)); from.paths=Math.min(sh.p,sig.p);
  }

  const h=new Date(now()).getHours(); let reh=false;
  if(((h>=5&&h<8)||(h>=18&&h<21))&&S.rehDay!==dkey()&&hsh("reh"+dkey())%3===0){ reh=true; S.rehDay=dkey() }
  const m=bildModel(W,K,{reh});
  const newK=from?K.filter(k=>!sh.k.split(",").includes(k.id)):[];
  if(from){ if(newK.length) m.ringKeep=newK[newK.length-1].id; else if(st>stageOf(sh.w)) m.ringStage=true }
  const info=Bild.mount(cv,m,from);

  const stUp=sh&&st>stageOf(sh.w);
  S.shown=sig; save();
  later(()=>maybeMoment(),from?(stUp?2600:1500):700);
}

function firstSentence(t){ const m=String(t).match(/^.+?[.!?](\s|$)/); return m?m[0].trim():t }

function impOfDay(){ if(!IMPULSE.length) return null; const today=dkey();

/* ---------- Hinweise: höchstens einer am Tag ---------- */
function pickHint(){

  if(H.day===today) return H.key&&!H.off[H.key]?hintDef(H.key):null;
  const d=new Date(now()), C=[];
  const pm=prevMonth(); if(pm&&!askDue().length&&S.inflow[pm.k]==null&&!H.off["zufluss-"+pm.k]) C.push("zufluss-"+pm.k);
  const losToday=losE().filter(e=>dkey(e.ts)===today).length;
  const recentWish=S.wishes.some(w=>now()-w.ts<7*DAY);

  if(d.getDay()===0&&S.log.some(e=>now()-e.ts<7*DAY)) C.push("woche-"+today);
  if(now()-S.created>21*DAY&&!S.exported&&S.log.length>=5) C.push("sichern");
  if(IOS&&/Safari/.test(navigator.userAgent)&&!/CriOS|FxiOS/.test(navigator.userAgent)&&navigator.standalone===false&&now()-S.created>2*DAY) C.push("home");
  const k=C.find(c=>!H.off[c]); if(!k) return null;

}
const INF=[["0","Nichts"],["1","1 bis 3 Dinge"],["4","4 bis 10 Dinge"],["11","Mehr als 10"]];

function pruefResult(d){
  const w=d.why||[], use=d.use, again=d.again, why=[];
  const recent=use==="w"||use==="m", old=use==="l"||use==="n", fresh=use==="neu";
  const strong=w.filter(z=>["oft","kann","sinn","gut"].includes(z));
  let k="kiste", n="In die Vielleicht-Kiste", x="Du bist unsicher. Leg es für dreißig Tage weg. Wenn du es in der Zeit nicht holst, weißt du mehr.";
  if(recent||again==="ja"||(strong.length&&!old)||(w.includes("sinn")&&again!=="nein")){
    k="keep"; n="Bewusst behalten"; x="Es spricht einiges dafür, dass dieses Ding dir dient. Gib ihm einen Grund und einen Platz."; }
  else if(old&&again==="nein"&&!strong.length&&!(w.includes("mal")&&d.repl==="nein")){ k="los"; n=d.cat==="pa"?"Aufräumen oder vernichten":"Weitergeben";
    x=d.cat==="pa"?"Du brauchst es nicht und würdest es nicht wieder besorgen. Bei Papieren gilt: Was keine Aufbewahrungsfrist hat, kann ins Altpapier. Persönliches vorher schreddern.":"Du nutzt es nicht und würdest es nicht wieder besorgen. Jemand anderes kann es vermutlich besser brauchen."; }
  else if(w.includes("sinn")&&old){ k="kiste"; n="Erinnerung festhalten, dann entscheiden"; x="Die Erinnerung ist dir wichtig, das Ding selbst nutzt du nicht. Mach ein Foto und schreib auf, was es dir bedeutet. Dann entscheide mit etwas Abstand."; }
  if(fresh&&k!=="keep"){ k="kiste"; n="Erst prüfen, ob Rückgabe geht"; x="Es ist neu und noch ungenutzt. Vielleicht kannst du es zurückgeben oder umtauschen. Sonst hilft die Vielleicht-Kiste beim Entscheiden."; }
  if(recent) why.push({t:"Du hast es in letzter Zeit benutzt. Was gebraucht wird, verdient seinen Platz."});
  if(old) why.push({t:use==="n"?"Du hast es noch nie benutzt, obwohl du es schon länger hast.":"Du hast es seit über einem Jahr nicht benutzt. Ein Jahr umfasst alle Jahreszeiten und die meisten Anlässe. Das ist eine Erfahrungsregel, keine Studie."});
  if(fresh) why.push({t:"Neue Dinge brauchen manchmal etwas Zeit, bis sie ihren Platz finden. Rückgabe lohnt sich zu prüfen, solange es geht."});
  if(again==="nein"&&!recent&&!w.includes("sinn")&&!w.includes("gesch")) why.push({t:"Du würdest es dir heute nicht wieder besorgen. Das kann ein Hinweis auf den Besitztumseffekt sein: Was uns gehört, schätzen wir oft höher ein.",imp:"i05"});
  if(w.includes("teuer")) why.push({t:"Dass es teuer war, ist ein schlechter Grund zum Behalten. Das Geld ist ausgegeben, ob es bleibt oder nicht.",imp:"i06"});
  if(w.includes("mal")) why.push({t:d.repl==="ja"?"Für „irgendwann“ kannst du es leihen oder wieder besorgen. Das Risiko ist klein.":"Wenn es schwer zu ersetzen ist, kann „irgendwann“ ein fairer Grund sein. Die Vielleicht-Kiste hilft beim Abwägen."});
  if(w.includes("gesch")) why.push({t:GESCHENK.t,imp:GESCHENK.imp});
  if(w.includes("mehr")) why.push({t:"Wenn du mehrere davon hast, behalte das beste und gib die anderen weiter."});
  if(w.includes("sinn")) why.push({t:"Ein Foto vom Erinnerungsstück kann helfen, die Erinnerung zu behalten und das Ding gehen zu lassen.",imp:"i07"});
  if(w.includes("kann")) why.push({t:"Dinge, mit denen du etwas selbst kannst, stärken Selbstständigkeit.",imp:KANN_IMP});
  return {k,n,x,why};
}

/* ---------- Bestandsaufnahme ---------- */
function checkResult(){
  const d=SH.d, ans=d.ans, sum={};
  AREAS.forEach(a=>sum[a.id]=0); CHECK.forEach(c=>{ sum[c.cat]+=ans[c.id]||0 });
  const top3=AREAS.map(a=>a.id).sort((x,y)=>sum[y]-sum[x]||AREAS.findIndex(a=>a.id===x)-AREAS.findIndex(a=>a.id===y)).slice(0,3);
  if(!d.saved){ d.saved=true; S.check={ts:now(),ans:Object.assign({},ans),top:top3,sum}; save() }
  const names=top3.map(a=>"„"+AREA[a].n+"“");
  const max=Math.max(...Object.values(sum));
  return `${shTop("Deine Bestandsaufnahme","Ergebnis")}
   <p class="lead">${max===0?"Besitz macht dir gerade kaum Druck. Die App beginnt trotzdem mit "+names[0]+".":"Am meisten Druck machen gerade "+names[0]+", "+names[1]+" und "+names[2]+"."}</p>
   <div class="list" style="margin-top:12px">${AREAS.map(a=>a.id).sort((x,y)=>sum[y]-sum[x]).map(a=>`<div class="row"><i class="dot ${a}"></i><span class="t"><b style="font-weight:500">${esc(AREA[a].n)}</b></span><span class="weg" style="width:auto;border:0;min-height:0;padding:0"><span class="st">${[0,1,2,3,4,5].map(k=>`<i class="${k<sum[a]?"on":""}" style="width:12px"></i>`).join("")}</span></span></div>`).join("")}</div>
   ${Object.values(ans).filter(v=>v===3).length>=4?`<div class="box"><p class="small" style="margin:0">Wenn dich das stark belastet, findest du unter „Wenn es schwer wird“ Anlaufstellen.</p><button class="lnk" data-a="open" data-v="hilfe">Wenn es schwer wird</button></div>`:""}
   <p class="small muted" style="margin-top:12px">Dein nächster Schritt richtet sich jetzt nach diesen Bereichen. In drei Monaten kannst du die Bestandsaufnahme wiederholen und vergleichen.</p>
   <div class="btns"><button class="btn" data-a="close">Zur Lichtung</button></div>`;
}

  {k:"nomiss",pri:5,c:()=>{ const s=stats(); return s.asked.length>=5 },t:"Dein eigener Beleg",x:null}

function maybeMoment(){
  if(undoFn){ later(()=>maybeMoment(),800); return }
  if(SH||TAB!=="home") return;
  const W=weite(), st=stageOf(W), due=[];
  if(st>0&&!S.mom["stage-"+st]) due.push({k:"stage-"+st,pri:10,t:STUFEN[st].n,x:STUFEN[st].x,art:true});
  MOM.forEach(m=>{ if(m.c&&!S.mom[m.k]&&m.c()) due.push(m) });
  if(!due.length) return;
  due.sort((a,b)=>b.pri-a.pri);
  const main=due[0], more=due.slice(1);
  if(main.k==="nomiss"){ const s=stats(); main.x="Von "+s.asked.length+" Dingen, nach denen die App gefragt hat, hast du "+s.missed.length+" vermisst. Das ist dein eigener Beleg, wie viel du wirklich brauchst." }
  // Ältere Stufen, die man übersprungen hat, gelten als gesehen
  for(let i=1;i<=st;i++) S.mom["stage-"+i]=now();
  due.forEach(m=>S.mom[m.k]=now()); save();
  openSheet("moment",null,{m:main,more});
}

  inflow(el){ S.inflow[el.dataset.v]=+el.dataset.w; S.hint.key=""; save(); render(); toast("Gespeichert. Du siehst es unter „Dein Weg“.") },
  hint(el){ const k=S.hint.key; if(el.dataset.v==="off") S.hint.off[k]=true; else S.hint.later=dkey(); save(); render() },
  undo(){ const f=undoFn; undoFn=null; $("#toast").classList.remove("show"); if(SH&&SH.type==="moment") closeSheet(); if(f) f() },
  ics(el){ downloadICS(el.dataset.v,+el.dataset.w) },
  export(){ const blob=new Blob([JSON.stringify(S)],{type:"application/json"}); const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download="lichtung-sicherung-"+dkey()+".json"; document.body.appendChild(a); a.click(); a.remove(); S.exported=now(); save(); toast("Sicherung erstellt.") },
  copy(){ const t=JSON.stringify(S); (navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>{ S.exported=now(); save(); toast("In die Zwischenablage kopiert.") }).catch(()=>{ toast("Kopieren ging nicht. Nutze „Sicherung speichern“.",{ok:false}) }) },
  import(){ const f=document.getElementById("f-file"), p=document.getElementById("f-paste").value.trim();
    const use=t=>{ try{ const o=JSON.parse(t); if(!o||!Array.isArray(o.log)||!o.settings) throw 0; SH.d={confirm:{o,date:fdateY(o.exported||o.created||now()),n:o.log.length}} }catch(e){ SH.d={err:"Das ist keine gültige Sicherung von Lichtung."} } drawSheet() };
    if(f&&f.files&&f.files[0]){ const r=new FileReader(); r.onload=()=>use(r.result); r.readAsText(f.files[0]) } else if(p) use(p); else { SH.d={err:"Wähle eine Datei oder füge den Text ein."}; drawSheet() } },
  filepick(){},
  "import-ok"(){ S=merge(fresh(),SH.d.confirm.o); migrate(); save(); applyTheme(); closeSheet(); toast("Sicherung geladen.") },
  "reset-1"(){ SH.d.sure=true; drawSheet() },
  "reset-ok"(){ try{ localStorage.removeItem(KEY) }catch(e){} S=fresh(); S.seen=true; save(); applyTheme(); closeSheet(); TAB="home"; render(); toast("Alles gelöscht. Die Lichtung beginnt neu.",{ok:false}) }
};
function markRead(id){ if(!id||!IMP[id]) return; const r=S.readRun, t=now();
  if(!S.read[id]) S.read[id]=t;
  if(r.day===dkey()&&t-r.t<15*60*1000) r.n++; else { r.n=1; r.day=dkey() } r.t=t; save() }
function go(tab){ if(tab===TAB){ scrollTo({top:0,behavior:RM()?"auto":"smooth"}); return }
  if(TAB==="home"&&tab!=="home"){ try{ history.pushState({ltab:1},"") }catch(e){} }
  TAB=tab; render(); scrollTo(0,0); $("#main").focus({preventScroll:true}) }

/* Zentraler Klick-Handler */
document.addEventListener("click",e=>{
  if(e.target.classList&&e.target.closest&&e.target.closest("label.hap")&&e.target.tagName!=="INPUT") return;
  const tabEl=e.target.closest(".tab"); if(tabEl){ go(tabEl.dataset.tab); return }
  const el=e.target.closest("[data-a]"); if(!el||el.disabled) return;
  if(e.target.tagName==="INPUT"&&e.target.closest("label.hap")) e.target.blur();
  const fn=A[el.dataset.a]; if(!fn) return;
  if(el.tagName==="A") return;
  tapKind=null;
  feedbackFor(el,e);
  fn(el,e);
  const f=tapKind||famOf(el); if(f) vibrateNow(f);
  tapKind=null;
});
document.addEventListener("keydown",e=>{
  if(!SH) return;
  if(e.key==="Escape"){ closeSheet(); return }
  if(e.key==="Tab"){ const f=[...$("#sheet").querySelectorAll("button:not(:disabled),a[href],input,textarea,summary")].filter(x=>x.offsetParent!==null&&!x.closest("label.hap"));
    if(!f.length) return; const a=f[0], b=f[f.length-1];
    if(e.shiftKey&&document.activeElement===a){ e.preventDefault(); b.focus() } else if(!e.shiftKey&&document.activeElement===b){ e.preventDefault(); a.focus() } }
});
/* Blatt am Griff herunterziehen */
(function(){ let y0=null, dy=0; const g=$("#grip"), sh=$("#sheet");
  g.addEventListener("pointerdown",e=>{ y0=e.clientY; dy=0; sh.classList.add("drag"); g.setPointerCapture(e.pointerId) });
  g.addEventListener("pointermove",e=>{ if(y0==null) return; dy=Math.max(0,e.clientY-y0); sh.style.transform=`translate(-50%,${dy}px)` });
  const end=()=>{ if(y0==null) return; y0=null; sh.classList.remove("drag"); if(dy>90) closeSheet(); else sh.style.transform=""; };
  g.addEventListener("pointerup",end); g.addEventListener("pointercancel",end);
})();

/* ---------- Teilen, Kalender ---------- */
function shareIt(v){
  const base=location.href.split("#")[0];
  let url=base, title="Lichtung", text="Lichtung hilft beim Loslassen, Warten und bewussten Behalten.";
  if(v.startsWith("i-")){ const i=IMP[v.slice(2)]; url=base+"#i-"+i.id; title=i.t; text=i.t+": ein Befund aus der App Lichtung." }
  if(v.startsWith("u-")){ const u=UEB[v.slice(2)]; url=base+"#u-"+u.id; title=u.t; text="Machst du mit? Übung „"+u.t+"“, "+(u.d===1?"ein Tag":u.d+" Tage")+"." }
  if(navigator.share){ navigator.share({title,text,url}).catch(()=>{}) }
  else if(navigator.clipboard){ navigator.clipboard.writeText(url).then(()=>toast("Link kopiert.")).catch(()=>toast("Kopieren ging nicht.",{ok:false})) }
  else toast("Teilen geht in diesem Browser nicht. Kopiere die Adresse aus der Adresszeile.",{ok:false});
}
function downloadICS(title,ts){
  const d=new Date(ts), f=x=>x.getFullYear()+String(x.getMonth()+1).padStart(2,"0")+String(x.getDate()).padStart(2,"0");
  const ics=["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Lichtung//DE","BEGIN:VEVENT","UID:"+uid()+"@lichtung","DTSTAMP:"+new Date().toISOString().replace(/[-:]/g,"").slice(0,15)+"Z",
    "DTSTART;VALUE=DATE:"+f(d),"DTEND;VALUE=DATE:"+f(new Date(ts+DAY)),"SUMMARY:"+title.replace(/[,;]/g," "),"DESCRIPTION:Erinnerung aus Lichtung","END:VEVENT","END:VCALENDAR"].join("\r\n");
  const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([ics],{type:"text/calendar"})); a.download="lichtung.ics"; document.body.appendChild(a); a.click(); a.remove();
}

/* ---------- Darstellung ---------- */
const mq=matchMedia("(prefers-color-scheme: dark)");
function applyTheme(){ const t=S.settings.theme, r=document.documentElement;
  if(t==="light") r.dataset.theme="light"; else if(t==="dark") r.dataset.theme="dark"; else delete r.dataset.theme;
  const dark=t==="dark"||(t==="system"&&mq.matches); r.dataset.dark=dark?"1":"0";
  const m=document.querySelectorAll('meta[name="theme-color"]'); m.forEach(x=>x.setAttribute("content",dark?"#111A15":"#EDEFE7")) }
mq.addEventListener&&mq.addEventListener("change",()=>{ applyTheme(); if(TAB==="home") mountBild() });
let rsT=0; addEventListener("resize",()=>{ clearTimeout(rsT); rsT=setTimeout(()=>{ moveDot(); if(TAB==="home") mountBild() },200) });

/* ---------- Selbst-Aktualisierung ---------- */
const busy=()=>!!SH||["INPUT","TEXTAREA"].includes((document.activeElement||{}).tagName);
function checkUpdate(){
  if(!/github\.io$/.test(location.hostname)) return;
  fetch(location.pathname,{cache:"reload"}).then(r=>r.text()).then(t=>{
    const m=t.match(/const BUILD="([^"]+)"/); if(!m||m[1]===BUILD) return;
    const go=()=>{ if(busy()){ setTimeout(go,4000); return } location.reload() }; go();
  }).catch(()=>{});
}

/* ---------- Start ---------- */
function deepLink(){ const h=location.hash.slice(1); if(!h) return false;
  const [k,...r]=h.split("-"), id=r.join("-");
  history.replaceState(null,"",location.pathname+location.search);
  if(k==="i"&&IMP[id]){ markRead(id); openSheet("imp",id); return true }
  if(k==="u"&&UEB[id]){ openSheet("ueb",id,{shared:true}); return true }
  return false }
function init(){
  load(); applyTheme(); render();
  if(!deepLink()&&!S.seen){ S.seen=true; save(); openSheet("welcome") }
  if(IOS) armHaptics();
  if("serviceWorker" in navigator&&location.protocol==="https:"&&/github\.io$/.test(location.hostname)) navigator.serviceWorker.register("sw.js").catch(()=>{});
  setTimeout(checkUpdate,1500);
  document.addEventListener("change",e=>{ if(e.target.id==="f-file"){ const n=$("#f-fname"); if(n) n.textContent=e.target.files[0]?e.target.files[0].name:"" } });
  addEventListener("hashchange",()=>{ if(location.hash.length>1){ if(SH) closeSheet(true); deepLink() } });
  document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible"){ checkUpdate(); if(!SH) render() } });
}
init();
